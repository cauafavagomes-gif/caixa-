<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caixa Fácil — Controle por Áudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #f1f8f3; --bg: #ffffff; --surface: #f3faf5; --surface-2: #e6f4ea; --text: #12261a; --text-muted: #5a7566;
  --border: #cfe6d6; --primary: #15803d; --primary-fill: #15803d; --primary-dark: #166534; --primary-light: #dcfce7;
  --danger: #dc2626; --danger-light: #fee2e2; --warning: #b45309; --warning-light: #fef3c7;
  --blue: #0f766e; --blue-light: #ccfbf1; --frame: #14532d;
  --font-display: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius: 16px; --radius-sm: 10px; --shadow: 0 4px 18px rgba(21, 128, 61, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #f1f8f3; --bg: #ffffff; --surface: #f3faf5; --surface-2: #e6f4ea; --text: #12261a; --text-muted: #5a7566;
    --border: #cfe6d6; --primary: #15803d; --primary-fill: #15803d; --primary-dark: #166534; --primary-light: #dcfce7;
    --danger: #dc2626; --danger-light: #fee2e2; --warning: #b45309; --warning-light: #fef3c7;
    --blue: #0f766e; --blue-light: #ccfbf1; --frame: #14532d;
    --shadow: 0 4px 18px rgba(21, 128, 61, 0.12);
  }
}
:root[data-theme="dark"] {
  --canvas: #f1f8f3; --bg: #ffffff; --surface: #f3faf5; --surface-2: #e6f4ea; --text: #12261a; --text-muted: #5a7566;
  --border: #cfe6d6; --primary: #15803d; --primary-fill: #15803d; --primary-dark: #166534; --primary-light: #dcfce7;
  --danger: #dc2626; --danger-light: #fee2e2; --warning: #b45309; --warning-light: #fef3c7;
  --blue: #0f766e; --blue-light: #ccfbf1; --frame: #14532d;
  --shadow: 0 4px 18px rgba(21, 128, 61, 0.12);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--canvas); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h3, .btn-primary, .btn-secondary, .btn-ghost, .navbtn, .pill, .badge, .value, .stat-box .value, .fab, .mic-btn {
  font-family: var(--font-display);
}
.value, .stat-box .value, strong, .list-item strong { font-variant-numeric: tabular-nums; }
h1 { text-wrap: balance; letter-spacing: -0.01em; }
#root { display: flex; justify-content: center; min-height: 100vh; }
.phone { width: 100%; max-width: 430px; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; position: relative; }

.screen { flex: 1; overflow-y: auto; padding: 16px 16px 96px; }
.topbar { padding: 20px 16px 12px; background: var(--bg); }
.topbar h1 { font-size: 20px; margin: 0; font-weight: 700; }
.topbar .sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
.row { display: flex; align-items: center; justify-content: space-between; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-box { background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.stat-box .label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.stat-box .value { font-size: 20px; font-weight: 800; margin-top: 4px; }
.value.positive { color: var(--primary); } .value.negative { color: var(--danger); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
.pill.selected { background: var(--primary-fill); border-color: var(--primary-fill); color: #fff; }
.pill.danger.selected { background: var(--danger); border-color: var(--danger); }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
button { font-family: inherit; cursor: pointer; color: inherit; background: none; border: none; }
.btn-primary { background: var(--primary-fill); color: #fff; border: none; border-radius: var(--radius-sm); padding: 14px 18px; font-size: 16px; font-weight: 700; width: 100%; }
.btn-primary:disabled { opacity: .5; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: none; border-radius: var(--radius-sm); padding: 14px 18px; font-size: 15px; font-weight: 700; width: 100%; }
.btn-ghost { background: transparent; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--text); }
input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 15px; background: var(--surface); color: var(--text); font-family: inherit; }
label.field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .02em; display: block; margin: 12px 0 6px; }
.bottomnav { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
.navbtn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 11px; font-weight: 600; padding: 4px 8px; flex: 1; }
.navbtn.active { color: var(--primary); }
.navbtn .icon { font-size: 20px; }
.fab { position: absolute; left: 50%; transform: translateX(-50%); top: -26px; width: 60px; height: 60px; border-radius: 50%; background: var(--primary-fill); color: #fff; border: 5px solid var(--bg); font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(21,128,61,.45); }
.fab-wrap { position: relative; width: 60px; }
.mic-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; gap: 18px; }
.mic-btn { width: 140px; height: 140px; border-radius: 50%; border: none; background: var(--primary-fill); color: #fff; font-size: 52px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 28px rgba(21,128,61,.4); }
.mic-btn.recording { background: var(--danger); animation: pulse 1.4s infinite; box-shadow: 0 6px 24px rgba(209,69,59,.4); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(209,69,59,.45); } 70% { box-shadow: 0 0 0 22px rgba(209,69,59,0); } 100% { box-shadow: 0 0 0 0 rgba(209,69,59,0); } }
.transcript-box { background: var(--surface); border-radius: var(--radius); padding: 14px; font-size: 15px; min-height: 50px; width: 100%; box-shadow: var(--shadow); }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge.entrada { background: var(--primary-light); color: var(--primary-dark); }
.badge.saida { background: var(--danger-light); color: var(--danger); }
.badge.pendente { background: var(--warning-light); color: var(--warning); }
.badge.pago { background: var(--primary-light); color: var(--primary-dark); }
.badge.atrasado { background: var(--danger-light); color: var(--danger); }
.list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: none; }
.empty-state { text-align: center; color: var(--text-muted); padding: 40px 16px; font-size: 14px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 100px; margin-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; height: 100%; }
.bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; }
.bar.entrada { --bar-top: var(--primary); --bar-bottom: var(--primary-dark); } .bar.saida { --bar-top: var(--danger); --bar-bottom: var(--danger); }
.bar-label { font-size: 9px; color: var(--text-muted); }
.progress-track { background: var(--surface-2); border-radius: 999px; height: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 999px; }
.alert-box { background: var(--warning-light); border: 1px solid rgba(180, 83, 9, .30); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--warning); font-weight: 600; margin-bottom: 10px; }
.alert-box.danger { background: var(--danger-light); border-color: rgba(220, 38, 38, .30); color: var(--danger); }
.close-x { background: none; border: none; font-size: 20px; color: var(--text-muted); padding: 4px 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-preview { width: 100%; border-radius: var(--radius-sm); max-height: 220px; object-fit: cover; }
.item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.item-row input { flex: 1; }
.link-btn { background: none; border: none; color: var(--blue); font-weight: 700; font-size: 14px; padding: 8px 0; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #14532d; color: #fff; padding: 12px 20px 12px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.28); z-index: 50; display: flex; align-items: center; gap: 8px; animation: toastIn .28s cubic-bezier(.2,.8,.2,1) both; }
.toast .toast-check { width: 18px; height: 18px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

/* ---- refinamentos: status bar, transições, micro-interações ---- */
.statusbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px 2px; font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text); user-select: none; }
.statusbar .icons { display: flex; align-items: center; gap: 6px; }
.statusbar .signal { display: flex; align-items: flex-end; gap: 2px; height: 9px; }
.statusbar .signal span { width: 3px; background: var(--text); border-radius: 1px; display: block; }
.statusbar .signal span:nth-child(1) { height: 40%; } .statusbar .signal span:nth-child(2) { height: 60%; }
.statusbar .signal span:nth-child(3) { height: 80%; } .statusbar .signal span:nth-child(4) { height: 100%; }
.statusbar .battery { width: 21px; height: 11px; border: 1.3px solid var(--text); border-radius: 3px; position: relative; padding: 1.5px; display: flex; }
.statusbar .battery::after { content: ''; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; background: var(--text); border-radius: 0 2px 2px 0; opacity: .6; }
.statusbar .battery-fill { background: var(--text); border-radius: 1px; width: 80%; }

.screen-fade { animation: screenIn .24s ease both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.pill, .btn-primary, .btn-secondary, .btn-ghost, .navbtn, .fab, .mic-btn, .close-x, .link-btn, .card-link {
  transition: transform .12s ease, background-color .15s ease, box-shadow .18s ease, border-color .15s ease;
}
.pill:active, .btn-secondary:active, .btn-ghost:active, .navbtn:active, .close-x:active, .link-btn:active { transform: scale(.95); }
.btn-primary:not(:disabled):active { transform: scale(.98); }
.fab:active { transform: translateX(-50%) scale(.93); }
.mic-btn:active { transform: scale(.95); }

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px;
}

.card-link { display: block; width: 100%; text-align: left; border: 1px solid transparent; cursor: pointer; }
.card-link:hover { box-shadow: 0 6px 20px rgba(21,128,61,.14); border-color: var(--border); }
.card-link:active { transform: scale(.99); }

.stat-icon { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-bottom: 8px; }

.bar { background-image: linear-gradient(180deg, var(--bar-top, var(--primary)), var(--bar-bottom, var(--primary-dark))); }

.waveform { display: flex; align-items: center; justify-content: center; gap: 5px; height: 60px; }
.waveform span { display: block; width: 5px; border-radius: 3px; background: var(--danger); animation: wave 1.1s ease-in-out infinite; }
.waveform span:nth-child(1) { height: 30%; animation-delay: 0s; }
.waveform span:nth-child(2) { height: 55%; animation-delay: .1s; }
.waveform span:nth-child(3) { height: 85%; animation-delay: .2s; }
.waveform span:nth-child(4) { height: 50%; animation-delay: .3s; }
.waveform span:nth-child(5) { height: 70%; animation-delay: .4s; }
.waveform span:nth-child(6) { height: 35%; animation-delay: .5s; }
.waveform span:nth-child(7) { height: 60%; animation-delay: .6s; }
@keyframes wave { 0%, 100% { transform: scaleY(.5); opacity: .75; } 50% { transform: scaleY(1); opacity: 1; } }

.loading-dots::after { content: ''; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
.progress-track.tetos { position: relative; }
.progress-fill.warning { background: var(--warning); }
.progress-fill.danger { background: var(--danger); }
@media print {
  body * { visibility: hidden; }
  #relatorio-impressao, #relatorio-impressao * { visibility: visible; }
  #relatorio-impressao { position: absolute; top: 0; left: 0; width: 100%; padding: 24px; color: #000; background: #fff; }
  #relatorio-impressao .card { box-shadow: none; border: 1px solid #ccc; background: #fff; color: #000; }
  #relatorio-impressao .value, #relatorio-impressao strong { color: #000 !important; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useSyncExternalStore } = React;

/* ================= categorias.js ================= */
const RAMOS = [
  { id: 'padaria', label: 'Padaria / Confeitaria' },
  { id: 'oficina', label: 'Oficina mecânica' },
  { id: 'salao', label: 'Salão de beleza / Barbearia' },
  { id: 'restaurante', label: 'Restaurante / Lanchonete' },
  { id: 'roupas', label: 'Loja de roupas' },
  { id: 'outro', label: 'Outro comércio' },
];
const CATEGORIAS_LANCAMENTO = ['Venda de produto', 'Prestação de serviço', 'Fornecedor', 'Aluguel', 'Salário', 'Pró-labore', 'Retirada de lucro', 'Imposto', 'Outros'];
const CATEGORIAS_CUSTO_FIXO = ['Funcionários', 'Aluguel', 'Água, luz e internet', 'Contador', 'Seguro', 'Outros'];
function categoriaLancamentoDoCustoFixo(categoria) {
  if (categoria === 'Funcionários') return 'Salário';
  if (categoria === 'Aluguel') return 'Aluguel';
  return 'Outros';
}
const FORMAS_PAGAMENTO = ['Dinheiro', 'Pix', 'Cartão de débito', 'Cartão de crédito', 'Boleto', 'Transferência'];
const CATEGORIAS_INSUMO_POR_RAMO = {
  padaria: ['Farinha e insumos', 'Embalagens', 'Equipamentos', 'Bebidas e revenda', 'Outros insumos'],
  oficina: ['Peças e autopeças', 'Óleo e lubrificantes', 'Ferramentas', 'Pneus', 'Outros insumos'],
  salao: ['Produtos químicos', 'Descartáveis', 'Equipamentos', 'Cosméticos para revenda', 'Outros insumos'],
  restaurante: ['Hortifruti', 'Carnes e frios', 'Bebidas', 'Embalagens', 'Outros insumos'],
  roupas: ['Peças para revenda', 'Embalagens', 'Etiquetas e tags', 'Outros insumos'],
  outro: ['Insumos gerais', 'Material de uso e consumo', 'Outros insumos'],
};
function categoriasInsumo(ramo) { return CATEGORIAS_INSUMO_POR_RAMO[ramo] || CATEGORIAS_INSUMO_POR_RAMO.outro; }
function sugerirCategoriaInsumo(nomeProduto, ramo) {
  const nome = (nomeProduto || '').toLowerCase();
  const opcoes = categoriasInsumo(ramo);
  const dict = {
    padaria: [[/farinha|fermento|acucar|açúcar|ovo|manteiga|leite/, 'Farinha e insumos'], [/saco|caixa|embalagem|papel/, 'Embalagens'], [/forno|masseira|batedeira/, 'Equipamentos'], [/refrigerante|suco|agua|água|cerveja/, 'Bebidas e revenda']],
    oficina: [[/pastilha|filtro|correia|amortecedor|peça|peca/, 'Peças e autopeças'], [/oleo|óleo|lubrificante/, 'Óleo e lubrificantes'], [/chave|ferramenta|macaco/, 'Ferramentas'], [/pneu/, 'Pneus']],
    salao: [[/tintura|shampoo|coloração|coloracao|agua oxigenada|química|quimica/, 'Produtos químicos'], [/luva|touca|papel toalha|descartavel|descartável/, 'Descartáveis'], [/secador|chapinha|maquina|máquina/, 'Equipamentos'], [/esmalte|creme|hidratante/, 'Cosméticos para revenda']],
    restaurante: [[/alface|tomate|cebola|verdura|fruta/, 'Hortifruti'], [/carne|frango|linguiça|linguica|frios|queijo/, 'Carnes e frios'], [/refrigerante|suco|agua|água|cerveja/, 'Bebidas'], [/saco|caixa|embalagem|marmita/, 'Embalagens']],
    roupas: [[/camisa|calca|calça|vestido|blusa|peça|peca/, 'Peças para revenda'], [/saco|sacola|embalagem/, 'Embalagens'], [/etiqueta|tag/, 'Etiquetas e tags']],
  };
  const regras = dict[ramo] || [];
  for (const [regex, categoria] of regras) { if (regex.test(nome)) return categoria; }
  return opcoes[opcoes.length - 1];
}

/* ================= interpret.js ================= */
const PALAVRAS_ENTRADA = ['vendi', 'venda', 'recebi', 'recebimento', 'entrou', 'ganhei', 'faturei'];
const PALAVRAS_SAIDA = ['comprei', 'compra', 'paguei', 'pagamento', 'gastei', 'gasto', 'saiu', 'devo'];
const FORMA_PAGAMENTO_REGRAS = [[/pix/i, 'Pix'], [/cart[aã]o de cr[eé]dito|cr[eé]dito/i, 'Cartão de crédito'], [/cart[aã]o de d[eé]bito|d[eé]bito/i, 'Cartão de débito'], [/boleto/i, 'Boleto'], [/transfer[eê]ncia|ted|doc/i, 'Transferência'], [/dinheiro|esp[eé]cie/i, 'Dinheiro']];
const CATEGORIA_REGRAS = [[/fornecedor|insumo|mercadoria|estoque/i, 'Fornecedor'], [/aluguel/i, 'Aluguel'], [/sal[aá]rio|funcion[aá]rio|folha/i, 'Salário'], [/imposto|das|simples nacional|tribut/i, 'Imposto'], [/servi[cç]o|conserto|manuten[cç][aã]o|corte|procedimento/i, 'Prestação de serviço'], [/produto|venda|vendi/i, 'Venda de produto']];
const NUMERO_RE = '\\d{1,3}(?:\\.\\d{3})*(?:,\\d{1,2})?|\\d+(?:,\\d{1,2})?';
function paraNumero(raw) {
  const valor = parseFloat(raw.replace(/\./g, '').replace(',', '.'));
  return isNaN(valor) ? null : valor;
}
function extrairValor(texto) {
  // Prioridade 1: número explicitamente marcado como dinheiro (R$ 15 / 15 reais) —
  // nunca o primeiro número da frase, que pode ser uma quantidade ("3 pães").
  const comMoeda = new RegExp(`r\\$\\s*(${NUMERO_RE})|(${NUMERO_RE})\\s*reais`, 'gi');
  const achadosMoeda = [...texto.matchAll(comMoeda)];
  if (achadosMoeda.length > 0) {
    const m = achadosMoeda[0];
    const valor = paraNumero(m[1] || m[2]);
    if (valor !== null) return valor;
  }
  // Prioridade 2: número logo após "por" (preço), ex.: "vendi 3 pães por 15".
  const porPreco = texto.match(new RegExp(`\\bpor\\s+(${NUMERO_RE})`, 'i'));
  if (porPreco) {
    const valor = paraNumero(porPreco[1]);
    if (valor !== null) return valor;
  }
  // Fallback: nenhuma marca de preço encontrada — usa o primeiro número da frase.
  const solto = texto.match(new RegExp(NUMERO_RE));
  return solto ? paraNumero(solto[0]) : null;
}
function contaPalavras(texto, lista) { return lista.reduce((acc, p) => acc + (texto.includes(p) ? 1 : 0), 0); }
function interpretarTranscricao(textoOriginal) {
  const texto = (textoOriginal || '').toLowerCase().trim();
  const scoreEntrada = contaPalavras(texto, PALAVRAS_ENTRADA);
  const scoreSaida = contaPalavras(texto, PALAVRAS_SAIDA);
  const tipo = scoreSaida > scoreEntrada ? 'Saída' : 'Entrada';

  let formaPagamento = 'Dinheiro';
  for (const [regex, forma] of FORMA_PAGAMENTO_REGRAS) { if (regex.test(texto)) { formaPagamento = forma; break; } }

  let categoriaConfianca = false;
  for (const [regex, cat] of CATEGORIA_REGRAS) { if (regex.test(texto)) { categoria = cat; categoriaConfianca = true; break; } }

// Aprendizado simples a partir do próprio histórico: se palavras da frase já apareceram
// antes em lançamentos de uma categoria específica, sugere essa categoria com mais força
// que a heurística genérica (e marca como "aprendido", não um simples palpite).
const PALAVRAS_IGNORADAS = new Set(['vendi', 'venda', 'comprei', 'compra', 'paguei', 'pagamento', 'recebi', 'reais', 'de', 'da', 'do', 'no', 'na', 'um', 'uma', 'por', 'com', 'para', 'pra', 'e', 'o', 'a']);

  return (texto || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter((p) => p.length >= 4 && !PALAVRAS_IGNORADAS.has(p));
}
function aprenderCategoriaDoHistorico(texto, lancamentos) {
  const palavras = extrairPalavrasChave(texto);
  if (palavras.length === 0) return null;
  const contagem = {};
  lancamentos.forEach((l) => {
    const palavrasLanc = extrairPalavrasChave(l.descricao);
    if (palavras.some((p) => palavrasLanc.includes(p))) {
      contagem[l.categoria] = (contagem[l.categoria] || 0) + 1;
    }
  });
  const entradas = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
  if (entradas.length === 0 || entradas[0][1] < 2) return null;
  return entradas[0][0];
}

  const base = interpretarTranscricao(textoOriginal);
  const aprendida = aprenderCategoriaDoHistorico(textoOriginal, lancamentos || []);
  if (aprendida && aprendida !== base.categoria) {
    return { ...base, categoria: aprendida, categoriaConfianca: true, categoriaAprendida: true };
  }
  return base;
}

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const recognition = new SR();
  recognition.lang = 'pt-BR';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = (event) => {
    let final = '', parcial = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += transcript; else parcial += transcript;
    }
    if (final) onResultadoFinal && onResultadoFinal(final);
    if (parcial) onResultadoParcial && onResultadoParcial(parcial);
  };
  recognition.onerror = (event) => onErro && onErro(event.error);
  recognition.onend = () => onFim && onFim();
  return recognition;
}

// Tabela progressiva do INSS (contribuição do empregado), valores de referência — a tabela é
// reajustada todo ano pelo governo. CONFIRME o valor vigente antes de descontar de alguém.
const TABELA_INSS_EMPREGADO = [
  { limite: 1412.00, aliquota: 0.075 },
  { limite: 2666.68, aliquota: 0.09 },
  { limite: 4000.03, aliquota: 0.12 },
  { limite: 7786.02, aliquota: 0.14 },

const TETO_INSS = 7786.02;

// Cálculo progressivo por faixas (como o IR): cada faixa de salário paga sua própria alíquota.
function calcularINSSEmpregado(salarioBruto) {
  const base = Math.min(salarioBruto, TETO_INSS);
  let inss = 0, faixaAnterior = 0;
  for (const faixa of TABELA_INSS_EMPREGADO) {
    if (base > faixaAnterior) {
      const nesta = Math.min(base, faixa.limite) - faixaAnterior;
      inss += nesta * faixa.aliquota;
    }
    faixaAnterior = faixa.limite;
  }
  return inss;
}
function calcularDescontoVT(salarioBruto, valorVT) { return Math.min(valorVT || 0, salarioBruto * 0.06); }
function calcularFGTS(salarioBruto) { return salarioBruto * ALIQUOTA_FGTS; }

// CPP (INSS patronal) já vem embutido no DAS para Anexos I, II, III e V — só é cobrado à parte (GPS) no Anexo IV.
function calcularCPPPatronal(salarioBruto, anexoSimples) { return anexoSimples === 'IV' ? salarioBruto * ALIQUOTA_INSS_PATRONAL_ANEXO_IV : 0; }

function mesesTrabalhadosNoAno(dataAdmissaoISO, anoRef, hoje) {
  const admissao = new Date(dataAdmissaoISO + 'T00:00:00');
  const inicioAno = new Date(anoRef, 0, 1);
  const inicio = admissao > inicioAno ? admissao : inicioAno;
  const fim = hoje.getFullYear() === anoRef ? hoje : new Date(anoRef, 11, 31);
  if (inicio > fim) return 0;
  let meses = (fim.getFullYear() - inicio.getFullYear()) * 12 + (fim.getMonth() - inicio.getMonth());
  if (fim.getDate() >= 15) meses += 1;
  return Math.max(0, Math.min(12, meses));
}
function calcularDecimoTerceiroProporcional(salarioBruto, meses) { return (salarioBruto / 12) * meses; }
function calcularFeriasProporcionais(salarioBruto, meses) { return (salarioBruto / 12) * meses * (4 / 3); }

function calcularFolhaFuncionario(func, anexoSimples, hoje) {
  const inss = calcularINSSEmpregado(func.salarioBruto);
  const descontoVT = calcularDescontoVT(func.salarioBruto, func.valorVT);
  const fgts = calcularFGTS(func.salarioBruto);
  const cppPatronal = calcularCPPPatronal(func.salarioBruto, anexoSimples);
  const liquido = func.salarioBruto - inss - descontoVT;
  const custoEmpresa = func.salarioBruto + fgts + cppPatronal + (func.valorVR || 0);
  const anoAtual = hoje.getFullYear();
  const meses = func.dataAdmissao ? mesesTrabalhadosNoAno(func.dataAdmissao, anoAtual, hoje) : 0;
  const decimoTerceiro = calcularDecimoTerceiroProporcional(func.salarioBruto, meses);
  const ferias = calcularFeriasProporcionais(func.salarioBruto, meses);
  return { inss, descontoVT, fgts, cppPatronal, liquido, custoEmpresa, meses, decimoTerceiro, ferias };
}

/* ================= Relatórios gerenciais (DRE, indicadores, precificação) ================= */
function dreDoMes(state, anoMes) {
  const lancamentosDoMes = state.lancamentos.filter((l) => l.data.slice(0, 7) === anoMes);
  const faturamento = lancamentosDoMes.filter((l) => l.tipo === 'Entrada').reduce((a, l) => a + l.valor, 0);
  const { fixas, variaveis } = despesasFixasVsVariaveis(lancamentosDoMes);
  const anexo = (state.perfil && state.perfil.anexoSimples) || 'I';
  const rbt12 = faturamentoUltimos12Meses(state.lancamentos, new Date(hojeISO() + 'T00:00:00'));
  const { aliquotaEfetiva } = calcularAliquotaEfetiva(anexo, rbt12);
  const impostos = faturamento * aliquotaEfetiva;
  const receitaLiquida = faturamento - impostos;
  const lucroLiquido = receitaLiquida - fixas - variaveis;
  return { anoMes, faturamento, impostos, receitaLiquida, custosFixos: fixas, custosVariaveis: variaveis, lucroLiquido, aliquotaEfetiva, qtdVendas: lancamentosDoMes.filter((l) => l.tipo === 'Entrada').length };
}
function dreAcumuladoAno(state, ano) {
  const meses = [];
  for (let m = 1; m <= 12; m++) meses.push(dreDoMes(state, `${ano}-${String(m).padStart(2, '0')}`));
  const soma = (campo) => meses.reduce((a, d) => a + d[campo], 0);
  return { faturamento: soma('faturamento'), impostos: soma('impostos'), receitaLiquida: soma('receitaLiquida'), custosFixos: soma('custosFixos'), custosVariaveis: soma('custosVariaveis'), lucroLiquido: soma('lucroLiquido') };
}
function ultimosNMesesDRE(state, n) {
  const hoje = new Date(hojeISO() + 'T00:00:00');
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
    const anoMes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    out.push({ label: d.toLocaleDateString('pt-BR', { month: 'short' }), ...dreDoMes(state, anoMes) });
  }
  return out;
}
function margemLucroPct(dre) { return dre.faturamento > 0 ? (dre.lucroLiquido / dre.faturamento) * 100 : 0; }
function pontoDeEquilibrio(dre) {
  const margemContribuicao = dre.faturamento > 0 ? (dre.faturamento - dre.custosVariaveis) / dre.faturamento : 0;
  return margemContribuicao > 0 ? dre.custosFixos / margemContribuicao : null;
}
function ticketMedioDoMes(state, anoMes) {
  const vendas = state.lancamentos.filter((l) => l.tipo === 'Entrada' && l.data.slice(0, 7) === anoMes);
  return vendas.length > 0 ? vendas.reduce((a, l) => a + l.valor, 0) / vendas.length : 0;
}
function cmvDoMes(state, anoMes) {
  return state.compras.filter((c) => c.data.slice(0, 7) === anoMes).reduce((a, c) => a + c.itens.reduce((s, it) => s + it.valorTotal, 0), 0);
}
function produtosComprados(state) {
  const produtos = new Map();
  state.compras.slice().sort((a, b) => new Date(a.data) - new Date(b.data)).forEach((c) => {
    c.itens.forEach((it) => produtos.set(it.produto, it.valorUnitario));
  });
  return [...produtos.entries()].map(([produto, ultimoValor]) => ({ produto, ultimoValor }));
}
function sugerirPreco(custo, margemPct, modo) {
  if (modo === 'markup') return custo * (1 + margemPct / 100);
  const divisor = 1 - margemPct / 100;
  return divisor > 0 ? custo / divisor : null;
}

/* ================= alertas inteligentes (detecção de anomalia) ================= */
function mesesAnteriores(anoMesRef, n) {
  const [ano, mes] = anoMesRef.split('-').map(Number);
  const out = [];
  for (let i = 1; i <= n; i++) {
    const d = new Date(ano, mes - 1 - i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  return out;
}
function detectarAnomalias(state) {
  const alertas = [];
  const mesAtual = hojeISO().slice(0, 7);
  const anteriores = mesesAnteriores(mesAtual, 3);

  const gastosPorCategoriaMes = (anoMes) => {
    const mapa = {};
    state.lancamentos.filter((l) => l.tipo === 'Saída' && l.data.slice(0, 7) === anoMes).forEach((l) => { mapa[l.categoria] = (mapa[l.categoria] || 0) + l.valor; });
    return mapa;
  };
  const atual = gastosPorCategoriaMes(mesAtual);
  const historico = anteriores.map(gastosPorCategoriaMes);

  Object.keys(atual).forEach((categoria) => {
    const valoresAnteriores = historico.map((h) => h[categoria] || 0).filter((v) => v > 0);
    if (valoresAnteriores.length < 2) return; // pouco histórico para comparar com segurança
    const media = valoresAnteriores.reduce((a, v) => a + v, 0) / valoresAnteriores.length;
    if (media > 0 && atual[categoria] > media * 1.5) {
      const pct = ((atual[categoria] / media) - 1) * 100;
      alertas.push({ tipo: 'gasto_categoria', mensagem: `Gasto com "${categoria}" este mês (${formatBRL(atual[categoria])}) está ${pct.toFixed(0)}% acima da sua média (${formatBRL(media)}).` });
    }
  });

  const faturamentoAtualParcial = state.lancamentos.filter((l) => l.tipo === 'Entrada' && l.data.slice(0, 7) === mesAtual).reduce((a, l) => a + l.valor, 0);
  const diaDoMes = new Date(hojeISO() + 'T00:00:00').getDate();
  const faturamentosAnteriores = anteriores.map((am) => state.lancamentos.filter((l) => l.tipo === 'Entrada' && l.data.slice(0, 7) === am).reduce((a, l) => a + l.valor, 0)).filter((v) => v > 0);
  if (faturamentosAnteriores.length >= 2 && diaDoMes >= 10) {
    const mediaMensal = faturamentosAnteriores.reduce((a, v) => a + v, 0) / faturamentosAnteriores.length;
    const esperadoAteHoje = mediaMensal * (diaDoMes / 30);
    if (esperadoAteHoje > 0 && faturamentoAtualParcial < esperadoAteHoje * 0.6) {
      alertas.push({ tipo: 'queda_faturamento', mensagem: `Faturamento até o dia ${diaDoMes} (${formatBRL(faturamentoAtualParcial)}) está bem abaixo do esperado pela sua média (~${formatBRL(esperadoAteHoje)}). Vale dar uma olhada no que mudou.` });
    }
  }
  return alertas;
}

/* ================= resumo falado (Web Speech Synthesis) ================= */
function sintesesDeVozDisponivel() { return typeof window !== 'undefined' && 'speechSynthesis' in window; }
function gerarResumoFalado(state, dias) {
  const resumo = resumoPeriodo(state.lancamentos, dias);
  const periodo = dias === 1 ? 'hoje' : dias === 7 ? 'essa semana' : `nos últimos ${dias} dias`;
  const situacao = resumo.lucro >= 0 ? 'seu lucro foi de' : 'você teve um prejuízo de';
  return `Resumo ${periodo}: você faturou ${formatBRL(resumo.faturamento)}, gastou ${formatBRL(resumo.despesas)}, e ${situacao} ${formatBRL(Math.abs(resumo.lucro))}.`;
}
function falarTexto(texto, onFim) {
  if (!sintesesDeVozDisponivel()) return false;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = 'pt-BR';
  utter.rate = 1;
  if (onFim) utter.onend = onFim;
  window.speechSynthesis.speak(utter);
  return true;
}

function comparativoPeriodoAnterior(lancamentos, dias) {
  const atual = resumoPeriodo(lancamentos, dias).faturamento;
  const fim = new Date(); fim.setDate(fim.getDate() - dias);
  const inicio = new Date(); inicio.setDate(inicio.getDate() - dias * 2);
  const anterior = lancamentos.filter((l) => { const d = new Date(l.data); return d >= inicio && d < fim && l.tipo === 'Entrada'; }).reduce((a, l) => a + l.valor, 0);
  if (anterior === 0) return null;
  return ((atual - anterior) / anterior) * 100;
}
function serieDiaria(lancamentos, dias) {
  const out = [];
  for (let i = dias - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    const doDia = lancamentos.filter((l) => l.data === iso);
    out.push({ data: iso, label: d.toLocaleDateString('pt-BR', { weekday: 'short' }).slice(0, 3), entrada: doDia.filter((l) => l.tipo === 'Entrada').reduce((a, l) => a + l.valor, 0), saida: doDia.filter((l) => l.tipo === 'Saída').reduce((a, l) => a + l.valor, 0) });
  }
  return out;
}
function despesasFixasVsVariaveis(lancamentos) {
  const FIXAS = ['Aluguel', 'Salário', 'Pró-labore'];
  // Retirada de lucro é distribuição do lucro já apurado, não um custo do negócio — não entra na conta.
  const saidas = lancamentos.filter((l) => l.tipo === 'Saída' && l.categoria !== 'Retirada de lucro');
  const total = saidas.reduce((a, l) => a + l.valor, 0);
  const fixas = saidas.filter((l) => FIXAS.includes(l.categoria)).reduce((a, l) => a + l.valor, 0);
  const variaveis = total - fixas;
  return { fixas, variaveis, total, pctFixas: total ? (fixas / total) * 100 : 0, pctVariaveis: total ? (variaveis / total) * 100 : 0 };
}
function contasProximas(contas, dias = 7) {
  const limite = new Date(); limite.setDate(limite.getDate() + dias);
  const hoje = new Date(hojeISO());
  return contas.filter((c) => c.status !== 'Pago').map((c) => { const venc = new Date(c.vencimento); const atrasado = venc < hoje; return { ...c, atrasado, diasRestantes: Math.ceil((venc - hoje) / 86400000) }; }).filter((c) => c.atrasado || new Date(c.vencimento) <= limite).sort((a, b) => new Date(a.vencimento) - new Date(b.vencimento));
}

// Próxima ocorrência de uma conta recorrente mensal, preservando o dia (com ajuste em meses curtos).
function proximaOcorrenciaMensal(vencimentoISO) {
  const [ano, mes, dia] = vencimentoISO.split('-').map(Number);
  const proximoMes = new Date(ano, mes, 1); // mes já é 1-indexado aqui, então isso é o mês seguinte em índice 0-based
  const ultimoDia = new Date(proximoMes.getFullYear(), proximoMes.getMonth() + 1, 0).getDate();
  const diaFinal = Math.min(dia, ultimoDia);
  return `${proximoMes.getFullYear()}-${String(proximoMes.getMonth() + 1).padStart(2, '0')}-${String(diaFinal).padStart(2, '0')}`;
}

// Régua de cobrança: nível de urgência de uma conta a receber.
const DIAS_LEMBRETE_COBRANCA = 3;
function nivelCobranca(conta, hoje) {
  const venc = new Date(conta.vencimento + 'T00:00:00');
  const diasParaVencer = Math.ceil((venc - hoje) / 86400000);
  if (diasParaVencer > DIAS_LEMBRETE_COBRANCA) return 'pendente';
  if (diasParaVencer >= 0) return 'lembrete';
  if (diasParaVencer >= -15) return 'atrasado';
  return 'atrasado_grave';
}

function gerarMensagemCobranca(conta, perfil) {
  const nomeCliente = conta.clienteNome ? conta.clienteNome.split(' ')[0] : '';
  const saudacao = nomeCliente ? `Oi, ${nomeCliente}!` : 'Oi!';
  const dataFmt = new Date(conta.vencimento + 'T00:00:00').toLocaleDateString('pt-BR');
  const nivel = nivelCobranca(conta, new Date(hojeISO() + 'T00:00:00'));
  const assinatura = perfil && perfil.nomeNegocio ? `\n\n— ${perfil.nomeNegocio}` : '';
  if (nivel === 'lembrete' || nivel === 'pendente') {
    return `${saudacao} Passando para lembrar que o pagamento de ${formatBRL(conta.valor)} (${conta.descricao}) vence em ${dataFmt}. Qualquer dúvida, é só chamar!${assinatura}`;
  }
  return `${saudacao} Notei que o pagamento de ${formatBRL(conta.valor)} (${conta.descricao}), com vencimento em ${dataFmt}, ainda não foi identificado por aqui. Pode verificar, por favor? Se já pagou, pode desconsiderar.${assinatura}`;
}

/* ================= Pix Copia e Cola (BR Code / EMVCo) ================= */
function crc16CCITT(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function removerAcentos(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function tlv(id, valor) { return `${id}${String(valor.length).padStart(2, '0')}${valor}`; }
function gerarPayloadPix({ chave, valor, nome, cidade, txid }) {
  const nomeLimpo = removerAcentos(nome).toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 25) || 'RECEBEDOR';
  const cidadeLimpa = removerAcentos(cidade).toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 15) || 'BRASIL';
  const txidLimpo = (txid || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***';
  const merchantAccountInfo = tlv('00', 'br.gov.bcb.pix') + tlv('01', chave.trim());
  const valorStr = Number(valor).toFixed(2);
  const semCRC =
    tlv('00', '01') +
    tlv('26', merchantAccountInfo) +
    tlv('52', '0000') +
    tlv('53', '986') +
    tlv('54', valorStr) +
    tlv('58', 'BR') +
    tlv('59', nomeLimpo) +
    tlv('60', cidadeLimpa) +
    tlv('62', tlv('05', txidLimpo)) +
    '6304';
  return semCRC + crc16CCITT(semCRC);
}
// Datas em que um custo fixo recorrente (aluguel, funcionário...) ainda vai "cair"
// dentro da janela [hoje, fim], pulando meses em que ele já foi lançado de verdade.
function ocorrenciasCustoFixo(custo, hoje, fim) {
  const ocorrencias = [];
  let cursor = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  let guard = 0;
  while (cursor <= fim && guard < 36) {
    guard++;
    const ano = cursor.getFullYear(), mes = cursor.getMonth();
    const ultimoDiaMes = new Date(ano, mes + 1, 0).getDate();
    const dataOcorrencia = new Date(ano, mes, Math.min(custo.diaVencimento, ultimoDiaMes));
    const mesChave = `${ano}-${String(mes + 1).padStart(2, '0')}`;
    if (dataOcorrencia >= hoje && dataOcorrencia <= fim && custo.ultimoMesLancado !== mesChave) {
      ocorrencias.push(dataOcorrencia);
    }
    cursor = new Date(ano, mes + 1, 1);
  }
  return ocorrencias;
}

// Fluxo de caixa projetado: parte do saldo real e soma/subtrai contas a pagar/receber
// futuras e custos fixos recorrentes ainda não lançados, até `dias` à frente.
function projecaoFluxoCaixa(state, dias) {
  const hoje = new Date(hojeISO() + 'T00:00:00');
  const fim = new Date(hoje); fim.setDate(fim.getDate() + dias);
  const saldoInicial = saldoCaixa(state.lancamentos);

  const eventos = [];
  state.contas.filter((c) => c.status !== 'Pago').forEach((c) => {
    const venc = new Date(c.vencimento + 'T00:00:00');
    if (venc >= hoje && venc <= fim) {
      eventos.push({ data: venc, valor: c.tipo === 'receber' ? c.valor : -c.valor, descricao: c.descricao, origem: c.tipo === 'receber' ? 'Conta a receber' : 'Conta a pagar' });
    }
  });
  state.custosFixos.forEach((c) => {
    if (!c.diaVencimento) return;
    ocorrenciasCustoFixo(c, hoje, fim).forEach((data) => {
      eventos.push({ data, valor: -c.valor, descricao: `${c.categoria} — ${c.descricao}`, origem: 'Custo fixo' });
    });
  });
  eventos.sort((a, b) => a.data - b.data);

  let saldoCorrente = saldoInicial;
  let diaNegativo = saldoInicial < 0 ? hoje : null;
  const linha = eventos.map((ev) => {
    saldoCorrente += ev.valor;
    if (saldoCorrente < 0 && diaNegativo === null) diaNegativo = ev.data;
    return { ...ev, saldoApos: saldoCorrente };
  });

  return { saldoInicial, saldoFinal: saldoCorrente, eventos: linha, diaNegativo };
}

/* ================= conciliação bancária ================= */

// Parser de CSV tolerante: detecta ; ou , como separador, ignora aspas simples.
function parseCSVExtrato(texto) {
  const linhas = texto.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (linhas.length === 0) return { header: [], linhas: [] };
  const sep = (linhas[0].match(/;/g) || []).length >= (linhas[0].match(/,/g) || []).length ? ';' : ',';
  const partir = (linha) => linha.split(sep).map((c) => c.trim().replace(/^"|"$/g, ''));
  const header = partir(linhas[0]);
  const dados = linhas.slice(1).map(partir);
  return { header, linhas: dados };
}

// Tenta achar automaticamente as colunas de data, descrição e valor pelo nome do cabeçalho.
function detectarColunasCSV(header) {
  const acha = (padroes) => header.findIndex((h) => padroes.some((p) => h.toLowerCase().includes(p)));
  return {
    data: acha(['data', 'date']),
    descricao: acha(['descri', 'histor', 'memo', 'lançamento', 'lancamento']),
    valor: acha(['valor', 'amount', 'value']),
  };
}

function paraNumeroExtrato(raw) {
  if (raw == null) return null;
  const limpo = String(raw).trim().replace(/r\$\s*/i, '').replace(/\./g, '').replace(',', '.');
  const n = parseFloat(limpo);
  return isNaN(n) ? null : n;
}

function paraDataExtrato(raw) {
  const s = String(raw).trim();
  // dd/mm/aaaa ou dd/mm/aa
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let [, d, mo, a] = m;
    if (a.length === 2) a = '20' + a;
    return `${a}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }
  // aaaa-mm-dd
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return null;
}

function transacoesDoCSV(texto, colunas) {
  const { header, linhas } = parseCSVExtrato(texto);
  const col = colunas || detectarColunasCSV(header);
  return linhas.map((linha) => ({
    data: paraDataExtrato(linha[col.data]),
    descricao: (linha[col.descricao] || '').trim(),
    valor: paraNumeroExtrato(linha[col.valor]),
  })).filter((t) => t.data && t.valor !== null);
}

// Parser de OFX tolerante (não exige tags de fechamento, comum em extratos SGML antigos).
function transacoesDoOFX(texto) {
  const blocos = texto.split(/<STMTTRN>/i).slice(1);
  return blocos.map((bloco) => {
    const corpo = bloco.split(/<\/STMTTRN>/i)[0];
    const pega = (tag) => {
      const m = corpo.match(new RegExp(`<${tag}>([^\\r\\n<]+)`, 'i'));
      return m ? m[1].trim() : '';
    };
    const dt = pega('DTPOSTED');
    const valor = pega('TRNAMT');
    const memo = pega('MEMO') || pega('NAME');
    const ano = dt.slice(0, 4), mes = dt.slice(4, 6), dia = dt.slice(6, 8);
    return {
      data: dt.length >= 8 ? `${ano}-${mes}-${dia}` : null,
      descricao: memo,
      valor: paraNumeroExtrato(valor),
    };
  }).filter((t) => t.data && t.valor !== null);
}

const TOLERANCIA_DIAS_CONCILIACAO = 3;
const TOLERANCIA_VALOR_CONCILIACAO = 0.01;

// Compara as transações importadas do banco com os lançamentos de um caixa específico.
function compararExtrato(transacoesBanco, lancamentos, caixaId, caixas) {
  const doCaixa = lancamentos.filter((l) => caixaIdEfetivo(l, caixas) === caixaId);
  const usados = new Set();
  const conciliadas = [];
  const somenteNoBanco = [];

  transacoesBanco.forEach((tx) => {
    const dataTx = new Date(tx.data + 'T00:00:00');
    let melhor = null, melhorDist = Infinity;
    doCaixa.forEach((l) => {
      if (usados.has(l.id) || l.conciliadoEm) return;
      const valorLanc = l.tipo === 'Entrada' ? l.valor : -l.valor;
      if (Math.abs(valorLanc - tx.valor) > TOLERANCIA_VALOR_CONCILIACAO) return;
      const dataLanc = new Date(l.data + 'T00:00:00');
      const dist = Math.abs(dataLanc - dataTx) / 86400000;
      if (dist <= TOLERANCIA_DIAS_CONCILIACAO && dist < melhorDist) { melhor = l; melhorDist = dist; }
    });
    if (melhor) { usados.add(melhor.id); conciliadas.push({ tx, lancamento: melhor }); }
    else somenteNoBanco.push(tx);
  });

  const datasTx = transacoesBanco.map((t) => new Date(t.data + 'T00:00:00'));
  const minData = datasTx.length ? new Date(Math.min(...datasTx)) : null;
  const maxData = datasTx.length ? new Date(Math.max(...datasTx)) : null;
  const somenteNoApp = doCaixa.filter((l) => {
    if (usados.has(l.id) || l.conciliadoEm) return false;
    if (!minData) return false;
    const d = new Date(l.data + 'T00:00:00');
    return d >= minData && d <= maxData;
  });

  return { conciliadas, somenteNoBanco, somenteNoApp };
}

function historicoPrecos(compras) {
  const porItem = new Map();
  compras.slice().sort((a, b) => new Date(a.data) - new Date(b.data)).forEach((compra) => {
    compra.itens.forEach((item) => {
      const chave = `${item.produto.toLowerCase()}|${compra.fornecedor.toLowerCase()}`;
      if (!porItem.has(chave)) porItem.set(chave, []);
      porItem.get(chave).push({ data: compra.data, valorUnitario: item.valorUnitario, fornecedor: compra.fornecedor, produto: item.produto, categoria: item.categoria });
    });
  });
  const linhas = [];
  for (const registros of porItem.values()) {
    for (let i = 0; i < registros.length; i++) {
      const atual = registros[i]; const anterior = registros[i - 1];
      const variacaoSemanal = anterior ? ((atual.valorUnitario - anterior.valorUnitario) / anterior.valorUnitario) * 100 : null;
      linhas.push({ produto: atual.produto, fornecedor: atual.fornecedor, categoria: atual.categoria, data: atual.data, valorUnitario: atual.valorUnitario, variacaoSemanal });
    }
  }
  return linhas.sort((a, b) => new Date(b.data) - new Date(a.data));
}
function alertasAumentoPreco(compras, limitePct = 5) { return historicoPrecos(compras).filter((l) => l.variacaoSemanal !== null && l.variacaoSemanal >= limitePct); }
function rankingInsumosSubiram(compras) {
  const linhas = historicoPrecos(compras).filter((l) => l.variacaoSemanal !== null);
  const porProduto = new Map();
  linhas.forEach((l) => { const chave = l.produto.toLowerCase(); if (!porProduto.has(chave) || l.data > porProduto.get(chave).data) porProduto.set(chave, l); });
  return [...porProduto.values()].sort((a, b) => b.variacaoSemanal - a.variacaoSemanal);
}
function comparativoFornecedores(compras) {
  const porProduto = new Map();
  compras.forEach((compra) => { compra.itens.forEach((item) => { const chave = item.produto.toLowerCase(); if (!porProduto.has(chave)) porProduto.set(chave, new Map()); const fornecedores = porProduto.get(chave); const atual = fornecedores.get(compra.fornecedor); if (!atual || compra.data > atual.data) fornecedores.set(compra.fornecedor, { data: compra.data, valorUnitario: item.valorUnitario }); }); });
  const out = [];
  for (const [produto, fornecedores] of porProduto.entries()) {
    if (fornecedores.size < 2) continue;
    const lista = [...fornecedores.entries()].map(([fornecedor, v]) => ({ fornecedor, ...v }));
    lista.sort((a, b) => b.valorUnitario - a.valorUnitario);
    out.push({ produto, maisCaro: lista[0], maisBarato: lista[lista.length - 1] });
  }
  return out;
}
function exportarCSV(lancamentos) {
  const header = ['Data', 'Hora', 'Tipo', 'Categoria', 'Descrição', 'Forma de pagamento', 'Valor', 'Origem', 'Observações'];
  const linhas = lancamentos.map((l) => [l.data, l.hora, l.tipo, l.categoria, l.descricao, l.formaPagamento, l.valor.toFixed(2).replace('.', ','), l.origem, l.observacoes]);
  const csv = [header, ...linhas].map((linha) => linha.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  return '﻿' + csv;
}
function formatBRL(valor) { return (valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

function Lancamentos({ onEditar }) {
  const state = useStore();

  const lista = useMemo(() => state.lancamentos.filter((l) => {

    if (busca && !l.descricao.toLowerCase().includes(busca.toLowerCase()) && !l.categoria.toLowerCase().includes(busca.toLowerCase())) return false;
    return true;
  }), [state.lancamentos, filtroTipo, busca]);
  const [exportando, setExportando] = useState(false);
  async function baixarCSV() {
    const csv = exportarCSV(state.lancamentos);
    setExportando(true);
    try {
      const downloads = window.claude ? await window.claude.use('downloads') : null;
      if (downloads) {
        await downloads.save({ filename: 'lancamentos.csv', data: new Blob([csv], { type: 'text/csv;charset=utf-8;' }) });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'lancamentos.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);

      if (e && e.code !== 'declined') alert('Não foi possível exportar agora. Tente novamente.');

      setExportando(false);

  return (
    <div>

function RecordFlow({ onSalvo, onCancelar }) {
  const state = useStore();
  const [etapa, setEtapa] = useState('gravar');
  const [gravando, setGravando] = useState(false);
  const [texto, setTexto] = useState('');
  const [interim, setInterim] = useState('');
  const [modoManual, setModoManual] = useState(false);
  const [erro, setErro] = useState(null);
  const [entrada, setEntrada] = useState(null);
  const recognitionRef = useRef(null);
  const suportado = !!speechRecognitionDisponivel();

  useEffect(() => {
    if (!suportado) return;
    recognitionRef.current = criarReconhecimento({
      onResultadoParcial: (parcial) => setInterim(parcial),
      onResultadoFinal: (final) => { setInterim(''); setTexto((atual) => (atual ? atual + ' ' : '') + final); },
      onErro: (e) => { if (e === 'no-speech') return; setErro('Não conseguimos acessar o microfone. Digite o lançamento manualmente.'); setGravando(false); setModoManual(true); },
      onFim: () => setGravando(false),
    });
    return () => { try { recognitionRef.current && recognitionRef.current.stop(); } catch {} };
  }, []);

  function iniciarGravacao() {
    setErro(null); setTexto(''); setInterim('');
    if (recognitionRef.current) {
      try { recognitionRef.current.start(); setGravando(true); }
      catch { setErro('Não foi possível iniciar o microfone.'); setModoManual(true); }
    } else { setModoManual(true); }
  }
  function pararGravacao() { try { recognitionRef.current && recognitionRef.current.stop(); } catch {} setGravando(false); }
  function confirmarTranscricao() {
    const resultado = interpretarComAprendizado(texto, state.lancamentos);
    setEntrada({ ...resultado, caixaId: (state.caixas[0] && state.caixas[0].id) || 'principal' });
    setEtapa('confirmar');
  }
  function salvar() { actions.addLancamento({ ...entrada, origem: modoManual ? 'manual' : 'audio' }); onSalvo(); }

  if (etapa === 'confirmar' && entrada) {
    return (
      <div className="screen" style={{ paddingTop: 8 }}>
        <div className="row" style={{ marginBottom: 10 }}><button className="close-x" onClick={() => setEtapa('gravar')}>←</button><h1 style={{ fontSize: 17, margin: 0 }}>Confirme o lançamento</h1><div style={{ width: 28 }} /></div>
        <div className="card">
          <label className="field-label">Tipo {entrada.tipoConfianca === false && <span style={{ color: 'var(--warning)', textTransform: 'none', fontWeight: 700 }}>· não tenho certeza, confira</span>}</label>
          <div className="chip-row">{['Entrada', 'Saída'].map((t) => <button key={t} className={`pill ${entrada.tipo === t ? (t === 'Saída' ? 'selected danger' : 'selected') : ''}`} onClick={() => setEntrada({ ...entrada, tipo: t })}>{t === 'Entrada' ? '💰 Entrada' : '📤 Saída'}</button>)}</div>
          <label className="field-label">Valor (R$)</label>
          <input type="number" step="0.01" value={entrada.valor ?? ''} placeholder="0,00" onChange={(e) => setEntrada({ ...entrada, valor: e.target.value })} />
          {entrada.confiancaBaixa && <div className="alert-box" style={{ marginTop: 8 }}>Não identificamos o valor no áudio — confira antes de salvar.</div>}
          <label className="field-label">Categoria {entrada.categoriaAprendida ? <span style={{ color: 'var(--primary)', textTransform: 'none', fontWeight: 700 }}>· 🧠 aprendida do seu histórico</span> : entrada.categoriaConfianca === false && <span style={{ color: 'var(--warning)', textTransform: 'none', fontWeight: 700 }}>· chute, confira</span>}</label>
          <div className="chip-row">{CATEGORIAS_LANCAMENTO.map((c) => <button key={c} className={`pill ${entrada.categoria === c ? 'selected' : ''}`} onClick={() => setEntrada({ ...entrada, categoria: c })}>{c}</button>)}</div>
          <label className="field-label">Forma de pagamento</label>
          <div className="chip-row">{FORMAS_PAGAMENTO.map((f) => <button key={f} className={`pill ${entrada.formaPagamento === f ? 'selected' : ''}`} onClick={() => setEntrada({ ...entrada, formaPagamento: f })}>{f}</button>)}</div>
          <label className="field-label">Descrição</label>
          <input type="text" value={entrada.descricao} onChange={(e) => setEntrada({ ...entrada, descricao: e.target.value })} />
          {state.caixas.length > 1 && (
            <React.Fragment>
              <label className="field-label">Caixa</label>
              <div className="chip-row">{state.caixas.map((c) => <button key={c.id} className={`pill ${entrada.caixaId === c.id ? 'selected' : ''}`} onClick={() => setEntrada({ ...entrada, caixaId: c.id })}>{ICONE_TIPO_CAIXA[c.tipo] || '📦'} {c.nome}</button>)}</div>
            </React.Fragment>
          )}
        </div>
        <button className="btn-primary" onClick={salvar} disabled={!entrada.valor}>✓ Salvar lançamento</button>
      </div>
    );
  }

  return (
    <div className="mic-screen">
      <button className="close-x" style={{ position: 'absolute', top: 16, left: 8 }} onClick={onCancelar}>✕</button>
      {!gravando && !modoManual && (
        <React.Fragment>
          <div><h1 style={{ fontSize: 19, marginBottom: 4 }}>Fale seu lançamento</h1><p style={{ color: 'var(--text-muted)', fontSize: 14, margin: 0, maxWidth: 260 }}>Ex.: "Vendi um corte de cabelo por 40 reais no Pix"</p></div>
          <button className="mic-btn" onClick={iniciarGravacao}>🎙️</button>
          <span style={{ color: 'var(--text-muted)', fontSize: 13 }}>Toque para começar a gravar</span>
          {suportado && <button className="link-btn" onClick={() => setModoManual(true)}>Prefiro digitar</button>}
        </React.Fragment>
      )}
      {gravando && (
        <React.Fragment>
          <h1 style={{ fontSize: 19, marginBottom: 4 }}>Ouvindo...</h1>
          <div className="waveform"><span /><span /><span /><span /><span /><span /><span /></div>
          <button className="mic-btn recording" onClick={pararGravacao}>⏹️</button>
          <div className="transcript-box">{texto}{interim ? ` ${interim}` : ''}{!texto && !interim ? 'Pode falar...' : ''}</div>
          <span style={{ color: 'var(--text-muted)', fontSize: 13 }}>Toque no botão para parar</span>
        </React.Fragment>
      )}
      {!gravando && !modoManual && texto && <button className="btn-primary" onClick={confirmarTranscricao}>Continuar →</button>}
      {erro && <div className="alert-box danger" style={{ maxWidth: 280 }}>{erro}</div>}
      {modoManual && (
        <div style={{ width: '100%', maxWidth: 300 }}>
          <label className="field-label">Digite o lançamento</label>
          <textarea rows={3} value={texto} onChange={(e) => setTexto(e.target.value)} placeholder="Ex.: Comprei farinha por 80 reais no cartão de débito" />
          {texto && <button className="btn-primary" style={{ marginTop: 10 }} onClick={confirmarTranscricao}>Continuar →</button>}
        </div>
      )}
    </div>
  );
}

const NIVEL_COBRANCA_LABEL = { pendente: 'Pendente', lembrete: '🔔 Vence em breve', atrasado: 'Atrasado', atrasado_grave: '🚨 Atrasado há muito tempo' };
const NIVEL_COBRANCA_CLASSE = { pendente: 'pendente', lembrete: 'pendente', atrasado: 'atrasado', atrasado_grave: 'atrasado' };

function PainelCobrancaPix({ conta, perfil }) {
  const qrRef = useRef(null);
  const chave = perfil && perfil.chavePixRecebimento;
  const payload = chave ? gerarPayloadPix({ chave, valor: conta.valor, nome: perfil.nomeNegocio, cidade: perfil.cidade, txid: conta.id }) : null;

  useEffect(() => {
    if (!payload || !qrRef.current || typeof QRCode === 'undefined') return;
    qrRef.current.innerHTML = '';
    new QRCode(qrRef.current, { text: payload, width: 160, height: 160 });
  }, [payload]);

  if (!chave) {
    return <div className="alert-box" style={{ marginTop: 8 }}>Cadastre sua chave Pix em Mais → Configurações para gerar cobranças.</div>;
  }

  async function copiar() {
    try { await navigator.clipboard.writeText(payload); } catch {
      const el = document.createElement('textarea'); el.value = payload; el.style.position = 'fixed'; el.style.opacity = '0';
      document.body.appendChild(el); el.focus(); el.select(); document.execCommand('copy'); document.body.removeChild(el);
    }
  }

  return (
    <div style={{ marginTop: 10, background: 'var(--surface-2)', borderRadius: 10, padding: 12, textAlign: 'center' }}>
      <div ref={qrRef} style={{ display: 'flex', justifyContent: 'center', marginBottom: 10 }} />
      <div style={{ fontSize: 11, color: 'var(--text-muted)', wordBreak: 'break-all', marginBottom: 8 }}>{payload}</div>
      <button className="btn-secondary" onClick={copiar}>📋 Copiar Pix Copia e Cola</button>
    </div>
  );
}

function Contas() {
  const state = useStore();
  const [mostrarForm, setMostrarForm] = useState(false);
  const [tipo, setTipo] = useState('pagar');
  const [descricao, setDescricao] = useState('');
  const [valor, setValor] = useState('');
  const [vencimento, setVencimento] = useState('');
  const [recorrente, setRecorrente] = useState(false);
  const [clienteNome, setClienteNome] = useState('');
  const [pixAbertoId, setPixAbertoId] = useState(null);

  function salvar() {
    if (!descricao.trim() || !valor || !vencimento) return;
    actions.addConta({ descricao: descricao.trim(), valor, vencimento, tipo, recorrente, clienteNome });
    setDescricao(''); setValor(''); setVencimento(''); setRecorrente(false); setClienteNome(''); setMostrarForm(false);
  }

  async function copiarCobranca(c) {
    const msg = gerarMensagemCobranca(c, state.perfil);
    try { await navigator.clipboard.writeText(msg); } catch {
      const el = document.createElement('textarea'); el.value = msg; el.style.position = 'fixed'; el.style.opacity = '0';
      document.body.appendChild(el); el.focus(); el.select(); document.execCommand('copy'); document.body.removeChild(el);
    }
    actions.registrarCobrancaEnviada(c.id);
  }

  const hoje = new Date(hojeISO() + 'T00:00:00');
  const ordenadas = [...state.contas].sort((a, b) => new Date(a.vencimento) - new Date(b.vencimento));

  return (
    <div>
      <div className="topbar" style={{ padding: 0, marginBottom: 12 }}>
        <div className="row"><div><h1>Contas a pagar e receber</h1><div className="sub">Não perca nenhum vencimento</div></div><button className="btn-ghost" onClick={() => setMostrarForm((v) => !v)}>{mostrarForm ? 'Fechar' : '+ Nova'}</button></div>
      </div>
      {mostrarForm && (
        <div className="card">
          <div className="chip-row"><button className={`pill ${tipo === 'pagar' ? 'selected' : ''}`} onClick={() => setTipo('pagar')}>A pagar</button><button className={`pill ${tipo === 'receber' ? 'selected' : ''}`} onClick={() => setTipo('receber')}>A receber</button></div>
          <label className="field-label">Descrição</label>
          <input type="text" value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder="Ex.: Aluguel de setembro" />
          {tipo === 'receber' && (
            <React.Fragment>
              <label className="field-label">Nome do cliente (opcional)</label>
              <input type="text" value={clienteNome} onChange={(e) => setClienteNome(e.target.value)} placeholder="Ex.: Maria Silva" />
            </React.Fragment>
          )}
          <label className="field-label">Valor (R$)</label>
          <input type="number" step="0.01" value={valor} onChange={(e) => setValor(e.target.value)} />
          <label className="field-label">Vencimento</label>
          <input type="date" value={vencimento} onChange={(e) => setVencimento(e.target.value)} />
          <label className="field-label" style={{ display: 'flex', alignItems: 'center', gap: 8, textTransform: 'none', fontSize: 14 }}>
            <input type="checkbox" checked={recorrente} onChange={(e) => setRecorrente(e.target.checked)} style={{ width: 'auto' }} />
            Conta recorrente (repete todo mês nesse dia)
          </label>
          <button className="btn-primary" style={{ marginTop: 14 }} onClick={salvar}>Salvar</button>
        </div>
      )}
      <div className="card">
        {ordenadas.length === 0 && <div className="empty-state">Nenhuma conta cadastrada.</div>}
        {ordenadas.map((c) => {
          const atrasado = c.status !== 'Pago' && c.vencimento < hojeISO();
          const nivel = c.tipo === 'receber' && c.status !== 'Pago' ? nivelCobranca(c, hoje) : null;
          const statusLabel = c.status === 'Pago' ? 'Pago' : nivel ? NIVEL_COBRANCA_LABEL[nivel] : (atrasado ? 'Atrasado' : 'Pendente');
          const statusClasse = c.status === 'Pago' ? 'pago' : nivel ? NIVEL_COBRANCA_CLASSE[nivel] : (atrasado ? 'atrasado' : 'pendente');
          return (
            <div className="list-item" key={c.id} style={{ flexDirection: 'column', alignItems: 'stretch', gap: 8 }}>
              <div className="row">
                <div>
                  <div style={{ fontWeight: 600 }}>{c.descricao}{c.recorrente ? ' 🔁' : ''}{c.clienteNome ? ` — ${c.clienteNome}` : ''}</div>
                  <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 3 }}>{c.tipo === 'pagar' ? 'A pagar' : 'A receber'} · vence em {new Date(c.vencimento + 'T00:00:00').toLocaleDateString('pt-BR')}</div>
                  <span className={`badge ${statusClasse}`} style={{ marginTop: 4, display: 'inline-block' }}>{statusLabel}</span>
                  {c.aprovadoEm && <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3 }}>{c.status === 'Pago' ? 'Pago' : 'Atualizado'} por {c.aprovadoPor} em {new Date(c.aprovadoEm).toLocaleDateString('pt-BR')}</div>}
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
                  <strong>{formatBRL(c.valor)}</strong>
                  {c.status !== 'Pago' ? <button className="link-btn" style={{ padding: 0 }} onClick={() => actions.setContaStatus(c.id, 'Pago')}>Marcar pago</button> : <button className="link-btn" style={{ padding: 0 }} onClick={() => actions.removeConta(c.id)}>Excluir</button>}
                </div>
              </div>
              {c.tipo === 'receber' && c.status !== 'Pago' && (
                <div className="chip-row">
                  <button className="btn-ghost" style={{ fontSize: 13, padding: '8px 12px' }} onClick={() => copiarCobranca(c)}>💬 Copiar mensagem de cobrança</button>
                  <button className="btn-ghost" style={{ fontSize: 13, padding: '8px 12px' }} onClick={() => setPixAbertoId(pixAbertoId === c.id ? null : c.id)}>💳 {pixAbertoId === c.id ? 'Fechar Pix' : 'Gerar cobrança Pix'}</button>
                  {c.cobrancasEnviadas && c.cobrancasEnviadas.length > 0 && <span style={{ fontSize: 11, color: 'var(--text-muted)', alignSelf: 'center' }}>Cobrado {c.cobrancasEnviadas.length}x</span>}
                </div>
              )}
              {pixAbertoId === c.id && <PainelCobrancaPix conta={c} perfil={state.perfil} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CustosFixos({ voltar, onToast }) {
  const state = useStore();
  const [categoria, setCategoria] = useState('Funcionários');
  const [descricao, setDescricao] = useState('');
  const [valor, setValor] = useState('');
  const [diaVencimento, setDiaVencimento] = useState('');
  const [chavePix, setChavePix] = useState('');
  const [caixaLancamento, setCaixaLancamento] = useState(() => (state.caixas[0] && state.caixas[0].id) || 'principal');

  function salvar() {
    if (!descricao.trim() || !valor) return;
    actions.addCustoFixo({ categoria, descricao: descricao.trim(), valor, diaVencimento, chavePix });
    setDescricao(''); setValor(''); setDiaVencimento(''); setChavePix('');
  }

  function lancarDoMes() {
    const n = actions.lancarCustosFixosDoMes(caixaLancamento);
    onToast(n > 0 ? `${n} despesa(s) lançada(s) este mês!` : 'Os custos fixos já foram lançados este mês.');
  }

  async function copiarPix(chave) {
    try {
      if (!navigator.clipboard) throw new Error('clipboard indisponível');
      await navigator.clipboard.writeText(chave);
      onToast('Chave Pix copiada!');
      return;
    } catch {
      // segue para o fallback abaixo
    }
    try {
      const el = document.createElement('textarea');
      el.value = chave; el.style.position = 'fixed'; el.style.opacity = '0';
      document.body.appendChild(el); el.focus(); el.select();
      const copiou = document.execCommand('copy');
      document.body.removeChild(el);
      onToast(copiou ? 'Chave Pix copiada!' : 'Não foi possível copiar. Toque e segure para copiar manualmente.');
    } catch {
      onToast('Não foi possível copiar. Toque e segure para copiar manualmente.');
    }
  }

  const total = state.custosFixos.reduce((a, c) => a + c.valor, 0);
  const porCategoria = CATEGORIAS_CUSTO_FIXO.map((cat) => ({
    categoria: cat,
    itens: state.custosFixos.filter((c) => c.categoria === cat),
  })).filter((g) => g.itens.length > 0);

  return (
    <div>
      <div className="row" style={{ marginBottom: 10 }}><button className="close-x" onClick={voltar}>←</button><h1 style={{ fontSize: 17, margin: 0 }}>Custos fixos</h1><div style={{ width: 28 }} /></div>

      <div className="card">
        <div className="row"><span>Total mensal cadastrado</span><strong style={{ fontSize: 18 }}>{formatBRL(total)}</strong></div>
        {state.custosFixos.length > 0 && (
          <React.Fragment>
            {state.caixas.length > 1 && (
              <React.Fragment>
                <label className="field-label">Sair de qual caixa</label>
                <div className="chip-row">{state.caixas.map((c) => <button key={c.id} className={`pill ${caixaLancamento === c.id ? 'selected' : ''}`} onClick={() => setCaixaLancamento(c.id)}>{ICONE_TIPO_CAIXA[c.tipo] || '📦'} {c.nome}</button>)}</div>
              </React.Fragment>
            )}
            <button className="btn-secondary" style={{ marginTop: 12 }} onClick={lancarDoMes}>Lançar despesas deste mês</button>
          </React.Fragment>
        )}
      </div>

      <div className="card">
        <h3>Novo custo fixo</h3>
        <label className="field-label">Categoria</label>
        <div className="chip-row">
          {CATEGORIAS_CUSTO_FIXO.map((c) => <button key={c} className={`pill ${categoria === c ? 'selected' : ''}`} onClick={() => setCategoria(c)}>{c}</button>)}
        </div>
        <label className="field-label">{categoria === 'Funcionários' ? 'Nome do funcionário / cargo' : 'Descrição'}</label>
        <input type="text" value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder={categoria === 'Funcionários' ? 'Ex.: Maria — Atendente' : categoria === 'Aluguel' ? 'Ex.: Aluguel da loja' : 'Ex.: Internet fibra 100MB'} />
        <div className="grid-2">
          <div>
            <label className="field-label">Valor mensal (R$)</label>
            <input type="number" step="0.01" value={valor} onChange={(e) => setValor(e.target.value)} />
          </div>
          <div>
            <label className="field-label">Dia de vencimento</label>
            <input type="number" min="1" max="31" placeholder="Opcional" value={diaVencimento} onChange={(e) => setDiaVencimento(e.target.value)} />
          </div>
        </div>
        {categoria === 'Funcionários' && (
          <React.Fragment>
            <label className="field-label">Chave Pix (para pagar rapidinho)</label>
            <input type="text" value={chavePix} onChange={(e) => setChavePix(e.target.value)} placeholder="CPF, e-mail, celular ou chave aleatória" />
          </React.Fragment>
        )}
        <button className="btn-primary" style={{ marginTop: 14 }} onClick={salvar} disabled={!descricao.trim() || !valor}>+ Adicionar custo fixo</button>
      </div>

      {porCategoria.length === 0 && <div className="card empty-state">Nenhum custo fixo cadastrado ainda.<br />Comece pelo aluguel ou pelos funcionários.</div>}

      {porCategoria.map((grupo) => (
        <div className="card" key={grupo.categoria}>
          <h3>{grupo.categoria}</h3>

    const file = e.target.files && e.target.files[0];

  const total = itens.reduce((a, it) => a + (Number(it.quantidade) || 0) * (Number(it.valorUnitario) || 0), 0);

        </div>

        <React.Fragment>
          <img src={foto} alt="Nota fiscal" className="photo-preview" style={{ marginBottom: 12 }} />

const PERIODOS_FLUXO = [{ id: 7, label: '7 dias' }, { id: 30, label: '30 dias' }, { id: 90, label: '90 dias' }];

function GraficoSaldoProjetado({ pontos }) {
  const w = 300, h = 110, padX = 8, padY = 14;
  const valores = pontos.map((p) => p.saldo);
  const min = Math.min(0, ...valores), max = Math.max(0, ...valores);
  const escalaY = (v) => {
    if (max === min) return h / 2;
    return h - padY - ((v - min) / (max - min)) * (h - padY * 2);
  };
  const escalaX = (i) => padX + (i / Math.max(1, pontos.length - 1)) * (w - padX * 2);
  const linha = pontos.map((p, i) => `${escalaX(i)},${escalaY(p.saldo)}`).join(' ');
  const y0 = escalaY(0);
  const corLinha = pontos[pontos.length - 1].saldo < 0 ? 'var(--danger)' : 'var(--primary)';
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height: 110, display: 'block' }}>
      <line x1={padX} y1={y0} x2={w - padX} y2={y0} stroke="var(--border)" strokeDasharray="3 3" strokeWidth="1" />
      <polyline points={linha} fill="none" stroke={corLinha} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {pontos.map((p, i) => (
        <circle key={i} cx={escalaX(i)} cy={escalaY(p.saldo)} r={i === pontos.length - 1 ? 4 : 2.5} fill={p.saldo < 0 ? 'var(--danger)' : 'var(--primary)'} />
      ))}
    </svg>
  );
}
