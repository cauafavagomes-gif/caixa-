function Conciliacao({ voltar, onToast }) {
  const state = useStore();
  const fileRef = useRef(null);
  const [caixaId, setCaixaId] = useState(() => (state.caixas[0] && state.caixas[0].id) || 'principal');
  const [arquivoNome, setArquivoNome] = useState(null);
  const [resultado, setResultado] = useState(null);
  const [erro, setErro] = useState(null);

  function selecionarArquivo(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErro(null);
    setArquivoNome(file.name);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const texto = reader.result;
        const ehOfx = /\.ofx$/i.test(file.name) || /<OFX>/i.test(texto);
        const transacoes = ehOfx ? transacoesDoOFX(texto) : transacoesDoCSV(texto);
        if (transacoes.length === 0) {
          setErro('Não conseguimos identificar transações neste arquivo. Confira se é um extrato OFX ou um CSV com colunas de data, descrição e valor.');
          setResultado(null);
          return;
        }
        setResultado(compararExtrato(transacoes, state.lancamentos, caixaId, state.caixas));
      } catch {
        setErro('Não foi possível ler este arquivo.');
        setResultado(null);
      }
    };
    reader.readAsText(file);
  }

  function confirmarConciliacoes() {
    resultado.conciliadas.forEach(({ lancamento }) => actions.conciliarLancamento(lancamento.id));
    onToast(`${resultado.conciliadas.length} lançamento(s) conciliado(s)!`);
    setResultado({ ...resultado, conciliadas: [] });
  }

  function criarLancamentoDoBanco(tx) {
    const item = actions.addLancamento({
      tipo: tx.valor >= 0 ? 'Entrada' : 'Saída',
      categoria: 'Outros',
      descricao: tx.descricao || 'Lançamento do extrato bancário',
      formaPagamento: 'Transferência',
      valor: Math.abs(tx.valor),
      origem: 'conciliacao',
      observacoes: 'Criado a partir do extrato importado',
      caixaId,
      data: tx.data,
    });
    actions.conciliarLancamento(item.id);
    setResultado({ ...resultado, somenteNoBanco: resultado.somenteNoBanco.filter((t) => t !== tx) });
    onToast('Lançamento criado e conciliado!');
  }

  return (
    <div>
      <div className="row" style={{ marginBottom: 10 }}><button className="close-x" onClick={voltar}>←</button><h1 style={{ fontSize: 17, margin: 0 }}>Conciliação bancária</h1><div style={{ width: 28 }} /></div>

      <div className="card">
        <div className="alert-box" style={{ background: 'var(--surface-2)', color: 'var(--text-muted)', border: '1px solid var(--border)' }}>
          Importe o extrato (arquivo .OFX do banco, ou .CSV com colunas de data/descrição/valor) para conferir automaticamente com seus lançamentos. Integração direta via Open Finance (Pluggy/Belvo) ainda não existe — por enquanto é importação manual do arquivo.
        </div>
        {state.caixas.length > 1 && (
          <React.Fragment>
            <label className="field-label">Este extrato é de qual caixa/conta</label>
            <div className="chip-row">{state.caixas.map((c) => <button key={c.id} className={`pill ${caixaId === c.id ? 'selected' : ''}`} onClick={() => setCaixaId(c.id)}>{ICONE_TIPO_CAIXA[c.tipo] || '📦'} {c.nome}</button>)}</div>
          </React.Fragment>
        )}
        <input ref={fileRef} type="file" accept=".ofx,.csv,.txt" style={{ display: 'none' }} onChange={selecionarArquivo} />
        <button className="btn-primary" style={{ marginTop: 14 }} onClick={() => fileRef.current && fileRef.current.click()}>📄 Importar extrato (OFX/CSV)</button>
        {arquivoNome && <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 8 }}>Arquivo: {arquivoNome}</div>}
      </div>

      {erro && <div className="alert-box danger">{erro}</div>}

      {resultado && (
        <React.Fragment>
          {resultado.conciliadas.length > 0 && (
            <div className="card">
              <h3>✅ Conciliadas automaticamente ({resultado.conciliadas.length})</h3>
              {resultado.conciliadas.map(({ tx, lancamento }, i) => (
                <div className="list-item" key={i}>
                  <div>
                    <div style={{ fontWeight: 600 }}>{lancamento.descricao}</div>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Extrato: {tx.descricao || '—'} · {new Date(tx.data + 'T00:00:00').toLocaleDateString('pt-BR')}</div>
                  </div>
                  <strong>{formatBRL(Math.abs(tx.valor))}</strong>
                </div>
              ))}
              <button className="btn-secondary" style={{ marginTop: 10 }} onClick={confirmarConciliacoes}>Confirmar conciliação</button>
            </div>
          )}

          {resultado.somenteNoBanco.length > 0 && (
            <div className="card">
              <h3>🏦 No extrato, sem lançamento no app ({resultado.somenteNoBanco.length})</h3>
              {resultado.somenteNoBanco.map((tx, i) => (
                <div className="list-item" key={i}>
                  <div>
                    <div style={{ fontWeight: 600 }}>{tx.descricao || 'Sem descrição'}</div>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{new Date(tx.data + 'T00:00:00').toLocaleDateString('pt-BR')}</div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <strong className={tx.valor >= 0 ? 'value positive' : 'value negative'}>{formatBRL(tx.valor)}</strong>
                    <button className="link-btn" style={{ padding: 0 }} onClick={() => criarLancamentoDoBanco(tx)}>+ Criar</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {resultado.somenteNoApp.length > 0 && (
            <div className="card">
              <h3>⚠️ No app, sem correspondência no extrato ({resultado.somenteNoApp.length})</h3>
              <div className="alert-box" style={{ marginBottom: 10 }}>Confira estes lançamentos — pode ser um valor digitado errado, uma duplicidade, ou o banco ainda não processou.</div>
              {resultado.somenteNoApp.map((l) => (
                <div className="list-item" key={l.id}>
                  <div>
                    <div style={{ fontWeight: 600 }}>{l.descricao}</div>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{new Date(l.data + 'T00:00:00').toLocaleDateString('pt-BR')}</div>
                  </div>
                  <strong className={l.tipo === 'Entrada' ? 'value positive' : 'value negative'}>{l.tipo === 'Entrada' ? '+' : '-'}{formatBRL(l.valor)}</strong>
                </div>
              ))}
            </div>
          )}

          {resultado.conciliadas.length === 0 && resultado.somenteNoBanco.length === 0 && resultado.somenteNoApp.length === 0 && (
            <div className="card empty-state">Tudo certo! Nenhuma divergência encontrada neste extrato.</div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function fechamentoMensal(state, anoMes) {
  const doMes = (tipo) => state.lancamentos.filter((l) => l.tipo === tipo && l.data.slice(0, 7) === anoMes);
  const entradas = doMes('Entrada');
  const saidas = doMes('Saída');
  const faturamento = entradas.reduce((a, l) => a + l.valor, 0);
  const despesas = saidas.reduce((a, l) => a + l.valor, 0);
  const porCategoria = {};
  saidas.forEach((l) => { porCategoria[l.categoria] = (porCategoria[l.categoria] || 0) + l.valor; });
  return { anoMes, faturamento, despesas, lucro: faturamento - despesas, porCategoria, qtdLancamentos: entradas.length + saidas.length };
}

function gerarTextoFechamento(state, fechamento, imposto) {
  const [ano, mes] = fechamento.anoMes.split('-');
  const nomeMes = new Date(Number(ano), Number(mes) - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const linhas = [
    `FECHAMENTO MENSAL — ${(state.perfil && state.perfil.nomeNegocio) || ''}`,
    `Período: ${nomeMes}`,
    `Gerado em: ${new Date().toLocaleString('pt-BR')}`,
    '',
    '--- RESUMO ---',
    `Faturamento bruto: ${formatBRL(fechamento.faturamento)}`,
    `Despesas totais: ${formatBRL(fechamento.despesas)}`,
    `Lucro do período: ${formatBRL(fechamento.lucro)}`,
    `Lançamentos no período: ${fechamento.qtdLancamentos}`,
    '',
    '--- DESPESAS POR CATEGORIA ---',
    ...Object.entries(fechamento.porCategoria).sort((a, b) => b[1] - a[1]).map(([cat, v]) => `${cat}: ${formatBRL(v)}`),
    '',
    '--- IMPOSTOS (ESTIMATIVA) ---',
    `Anexo do Simples Nacional considerado: ${imposto.anexo} (${DESCRICAO_ANEXO[imposto.anexo]})`,
    `Faturamento acumulado 12 meses (RBT12): ${formatBRL(imposto.rbt12)}`,
    `Alíquota efetiva estimada: ${(imposto.aliquotaEfetiva * 100).toFixed(2)}%`,
    `DAS estimado do período: ${formatBRL(fechamento.faturamento * imposto.aliquotaEfetiva)}`,
    '',
    'AVISO: valores de impostos são estimativas para planejamento, calculadas com as tabelas',
    'padrão do Simples Nacional (Anexos I a V). Não substituem o cálculo oficial feito pelo',
    'PGDAS-D nem a orientação de um contador. Confirme sempre antes de pagar qualquer guia.',
  ];
  return linhas.join('\n');
}

function Impostos({ voltar }) {
  const state = useStore();
  const anexoInicial = state.perfil.anexoSimples || SUGESTAO_ANEXO_POR_RAMO[state.perfil.ramo] || 'I';
  const [anexo, setAnexo] = useState(anexoInicial);
  const [percentualCustom, setPercentualCustom] = useState(state.perfil.percentualReservaImpostos != null ? String(state.perfil.percentualReservaImpostos) : '');
  const [mesFechamento, setMesFechamento] = useState(hojeISO().slice(0, 7));
  const [exportando, setExportando] = useState(false);
  const hoje = new Date(hojeISO() + 'T00:00:00');

  function escolherAnexo(a) { setAnexo(a); actions.salvarPerfil({ anexoSimples: a }); }
  function salvarPercentual() { actions.salvarPerfil({ percentualReservaImpostos: percentualCustom === '' ? null : Number(percentualCustom) }); }

  const rbt12 = faturamentoUltimos12Meses(state.lancamentos, hoje);
  const { aliquotaEfetiva, aliquotaNominal, faixaIndex } = calcularAliquotaEfetiva(anexo, rbt12);
  const mesAtual = hojeISO().slice(0, 7);
  const faturamentoMesAtual = faturamentoMesCalendario(state.lancamentos, mesAtual);
  const dasEstimadoMes = faturamentoMesAtual * aliquotaEfetiva;
  const pctSublimite = Math.min(100, (rbt12 / SUBLIMITE_SIMPLES) * 100);
  const pctTeto = Math.min(100, (rbt12 / TETO_SIMPLES) * 100);

  const percentualReserva = percentualCustom !== '' ? Number(percentualCustom) : aliquotaEfetiva * 100;
  const faturamentoTotalHistorico = state.lancamentos.filter((l) => l.tipo === 'Entrada').reduce((a, l) => a + l.valor, 0);
  const reservaSugeridaMes = faturamentoMesAtual * (percentualReserva / 100);
  const reservaSugeridaTotal = faturamentoTotalHistorico * (percentualReserva / 100);

  const fechamento = fechamentoMensal(state, mesFechamento);

  async function exportarFechamento() {
    setExportando(true);
    const texto = gerarTextoFechamento(state, fechamento, { anexo, rbt12, aliquotaEfetiva });
    const nomeArquivo = `fechamento-${mesFechamento}.txt`;
    try {
      const downloads = window.claude ? await window.claude.use('downloads') : null;
      if (downloads) {
        await downloads.save({ filename: nomeArquivo, data: new Blob([texto], { type: 'text/plain;charset=utf-8;' }) });
      } else {
        const blob = new Blob([texto], { type: 'text/plain;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = nomeArquivo;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      }
    } catch (e) {
      if (e && e.code !== 'declined') alert('Não foi possível exportar agora.');
    } finally {
      setExportando(false);
    }
  }

  const [ano, mesNum] = mesFechamento.split('-');
  const nomeMesFechamento = new Date(Number(ano), Number(mesNum) - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

  return (
    <div>
      <div className="row" style={{ marginBottom: 10 }}><button className="close-x" onClick={voltar}>←</button><h1 style={{ fontSize: 17, margin: 0 }}>Impostos (Simples Nacional)</h1><div style={{ width: 28 }} /></div>

      <div className="alert-box danger">
        ⚠️ Isto é uma <strong>estimativa</strong> para ajudar no planejamento, calculada com as tabelas públicas do Simples Nacional (Anexos I a V, vigentes desde 2018). Não é um cálculo oficial, não substitui o PGDAS-D nem seu contador, e pode não refletir mudanças recentes na legislação, Fator R, retenções ou benefícios do seu município. <strong>Confirme sempre com um contador antes de pagar qualquer guia.</strong>
      </div>

      <div className="card">
        <h3>Anexo do Simples Nacional</h3>
        <div className="chip-row">{Object.keys(DESCRICAO_ANEXO).map((a) => <button key={a} className={`pill ${anexo === a ? 'selected' : ''}`} onClick={() => escolherAnexo(a)}>{a}</button>)}</div>
        <div style={{ fontSize: 13, color: 'var(--text-muted)', marginTop: 8 }}>{DESCRICAO_ANEXO[anexo]}</div>
      </div>

      <div className="stat-grid" style={{ marginBottom: 14 }}>
        <div className="stat-box"><div className="label">Faturamento 12 meses</div><div className="value">{formatBRL(rbt12)}</div></div>
        <div className="stat-box"><div className="label">Alíquota efetiva</div><div className="value">{(aliquotaEfetiva * 100).toFixed(2)}%</div></div>
      </div>

      <div className="card">
        <h3>DAS estimado — {new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</h3>
        <div className="row"><span>Faturamento do mês</span><strong>{formatBRL(faturamentoMesAtual)}</strong></div>
        <div className="row" style={{ marginTop: 6 }}><span>DAS estimado</span><strong style={{ fontSize: 18 }}>{formatBRL(dasEstimadoMes)}</strong></div>
        <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6 }}>Faixa {faixaIndex} de 6 · alíquota nominal {(aliquotaNominal * 100).toFixed(2)}%</div>
      </div>

      <div className="card">
        <h3>Limites do Simples Nacional</h3>
        <div className="row"><span>Sublimite ICMS/ISS (R$ 3,6 mi)</span><strong>{pctSublimite.toFixed(1)}%</strong></div>
        <div className="progress-track" style={{ marginBottom: 12 }}><div className={`progress-fill ${pctSublimite >= 90 ? 'danger' : pctSublimite >= 70 ? 'warning' : ''}`} style={{ width: `${pctSublimite}%` }} /></div>
        <div className="row"><span>Teto do Simples (R$ 4,8 mi)</span><strong>{pctTeto.toFixed(1)}%</strong></div>
        <div className="progress-track"><div className={`progress-fill ${pctTeto >= 90 ? 'danger' : pctTeto >= 70 ? 'warning' : ''}`} style={{ width: `${pctTeto}%` }} /></div>
        {pctSublimite >= 70 && <div className="alert-box" style={{ marginTop: 10 }}>Você está a {(100 - pctSublimite).toFixed(0)}% do sublimite de R$ 3,6 milhões. Ao ultrapassar, o ICMS/ISS passa a ser recolhido por fora do Simples (guia separada). Fale com seu contador com antecedência.</div>}
        {pctTeto >= 70 && <div className="alert-box danger" style={{ marginTop: 10 }}>Você está a {(100 - pctTeto).toFixed(0)}% do teto de R$ 4,8 milhões. Ultrapassar esse valor exclui a empresa do Simples Nacional no ano seguinte.</div>}
      </div>

      <div className="card">
        <h3>Conta reserva de impostos</h3>
        <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 10 }}>Não é uma conta bancária de verdade — é só um valor sugerido pra você separar do dinheiro que entra, pra não gastar o que é do imposto.</div>
        <label className="field-label">% a reservar de cada venda (deixe em branco para usar a alíquota efetiva)</label>
        <input type="number" step="0.1" value={percentualCustom} onChange={(e) => setPercentualCustom(e.target.value)} onBlur={salvarPercentual} placeholder={`${(aliquotaEfetiva * 100).toFixed(2)} (automático)`} />
        <div className="row" style={{ marginTop: 12 }}><span>Reservar este mês</span><strong>{formatBRL(reservaSugeridaMes)}</strong></div>
        <div className="row" style={{ marginTop: 6 }}><span>Total sugerido (histórico, aproximado)</span><strong>{formatBRL(reservaSugeridaTotal)}</strong></div>
      </div>

      <div className="card">
        <h3>Fechamento mensal para o contador</h3>
        <label className="field-label">Mês</label>
        <input type="month" value={mesFechamento} onChange={(e) => setMesFechamento(e.target.value)} />
        <div id="relatorio-impressao" style={{ marginTop: 12 }}>
          <div className="row"><span>Faturamento bruto</span><strong>{formatBRL(fechamento.faturamento)}</strong></div>
          <div className="row" style={{ marginTop: 6 }}><span>Despesas totais</span><strong>{formatBRL(fechamento.despesas)}</strong></div>
          <div className="row" style={{ marginTop: 6 }}><span>Lucro do período</span><strong className={fechamento.lucro >= 0 ? 'value positive' : 'value negative'}>{formatBRL(fechamento.lucro)}</strong></div>
          <div className="row" style={{ marginTop: 6 }}><span>DAS estimado ({nomeMesFechamento})</span><strong>{formatBRL(fechamento.faturamento * aliquotaEfetiva)}</strong></div>
          {Object.keys(fechamento.porCategoria).length > 0 && (
            <React.Fragment>
              <label className="field-label">Despesas por categoria</label>
              {Object.entries(fechamento.porCategoria).sort((a, b) => b[1] - a[1]).map(([cat, v]) => (
                <div className="list-item" key={cat}><span>{cat}</span><strong>{formatBRL(v)}</strong></div>
              ))}
            </React.Fragment>
          )}
        </div>
        <div className="grid-2" style={{ marginTop: 14 }}>
          <button className="btn-secondary" onClick={exportarFechamento} disabled={exportando}>{exportando ? 'Exportando...' : '⬇️ Baixar (.txt)'}</button>
          <button className="btn-ghost" onClick={() => window.print()}>🖨️ Imprimir / Salvar PDF</button>
        </div>
      </div>
    </div>
  );
}

}

      <div className="row" style={{ marginBottom: 10 }}><button className="close-x" onClick={voltar}>←</button><h1 style={{ fontSize: 17, margin: 0 }}>Relatórios gerenciais</h1><div style={{ width: 28 }} /></div>

      <label className="field-label">Mês de referência</label>
      <input type="month" value={mesRef} onChange={(e) => setMesRef(e.target.value)} style={{ marginBottom: 12 }} />

      <div className="card">
        <div className="row">
          <h3 style={{ margin: 0 }}>DRE simplificado</h3>
          <div className="chip-row">
            <button className={`pill ${modoVisao === 'mes' ? 'selected' : ''}`} onClick={() => setModoVisao('mes')}>{nomeMes}</button>
            <button className={`pill ${modoVisao === 'ano' ? 'selected' : ''}`} onClick={() => setModoVisao('ano')}>Acumulado {ano}</button>
          </div>
        </div>
        <div style={{ marginTop: 12 }}>
          <div className="row"><span>Receita bruta</span><strong>{formatBRL(dreAtual.faturamento)}</strong></div>
          <div className="row" style={{ marginTop: 6 }}><span>(–) Impostos estimados</span><strong className="value negative">{formatBRL(dreAtual.impostos)}</strong></div>
          <div className="row" style={{ marginTop: 6, borderTop: '1px solid var(--border)', paddingTop: 6 }}><span>Receita líquida</span><strong>{formatBRL(dreAtual.receitaLiquida)}</strong></div>
          <div className="row" style={{ marginTop: 6 }}><span>(–) Custos variáveis</span><strong className="value negative">{formatBRL(dreAtual.custosVariaveis)}</strong></div>
          <div className="row" style={{ marginTop: 6 }}><span>(–) Custos fixos</span><strong className="value negative">{formatBRL(dreAtual.custosFixos)}</strong></div>
          <div className="row" style={{ marginTop: 6, borderTop: '1px solid var(--border)', paddingTop: 6 }}><span>Lucro líquido</span><strong style={{ fontSize: 18 }} className={dreAtual.lucroLiquido >= 0 ? 'value positive' : 'value negative'}>{formatBRL(dreAtual.lucroLiquido)}</strong></div>
        </div>
      </div>

      <div className="card">
        <h3>Últimos 6 meses</h3>
        <div className="bars">
          {serie.map((d) => (
            <div className="bar-col" key={d.anoMes}>
              <div style={{ display: 'flex', gap: 2, alignItems: 'flex-end', height: 90, width: '100%' }}>
                <div className="bar entrada" title={`Faturamento: ${formatBRL(d.faturamento)}`} style={{ height: `${(d.faturamento / maxSerie) * 90}px` }} />
                <div className="bar saida" title={`Custos + impostos: ${formatBRL(d.custosFixos + d.custosVariaveis + d.impostos)}`} style={{ height: `${((d.custosFixos + d.custosVariaveis + d.impostos) / maxSerie) * 90}px` }} />
              </div>
              <span className="bar-label">{d.label}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="stat-grid" style={{ marginBottom: 14 }}>
        <div className="stat-box"><div className="stat-icon" style={{ background: 'var(--primary-light)' }}>📈</div><div className="label">Margem de lucro</div><div className={`value ${margem >= 0 ? 'positive' : 'negative'}`}>{margem.toFixed(1)}%</div></div>
        <div className="stat-box"><div className="stat-icon" style={{ background: 'var(--blue-light)' }}>⚖️</div><div className="label">Ponto de equilíbrio</div><div className="value">{equilibrio != null ? formatBRL(equilibrio) : '—'}</div></div>
        <div className="stat-box"><div className="stat-icon" style={{ background: 'var(--primary-light)' }}>🎟️</div><div className="label">Ticket médio</div><div className="value">{formatBRL(ticket)}</div></div>
        <div className="stat-box"><div className="stat-icon" style={{ background: 'var(--danger-light)' }}>📦</div><div className="label">CMV do mês</div><div className="value">{formatBRL(cmv)}</div></div>
      </div>
      <div className="card" style={{ background: 'var(--surface-2)' }}>
        <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
          <strong>Ponto de equilíbrio</strong>: quanto você precisa faturar no mês só para cobrir os custos, sem lucro nem prejuízo.<br /><br />
          <strong>CMV</strong>: soma das compras de insumos registradas por foto de nota fiscal no mês (aba "Fotografar nota fiscal").
        </div>
      </div>
    </div>
  );
}

function Precificacao({ voltar }) {
  const state = useStore();
  const produtos = produtosComprados(state);
  const [produtoSelecionado, setProdutoSelecionado] = useState('');
  const [custo, setCusto] = useState('');
  const [margemPct, setMargemPct] = useState('30');
  const [modo, setModo] = useState('margem');

  function selecionarProduto(p) {
    setProdutoSelecionado(p);
    const item = produtos.find((x) => x.produto === p);
    if (item) setCusto(String(item.ultimoValor));
  }

  const custoNum = Number(custo) || 0;
  const preco = custoNum > 0 ? sugerirPreco(custoNum, Number(margemPct) || 0, modo) : null;
  const lucroUnitario = preco != null ? preco - custoNum : null;

  return (
    <div>
      <div className="row" style={{ marginBottom: 10 }}><button className="close-x" onClick={voltar}>←</button><h1 style={{ fontSize: 17, margin: 0 }}>Sugestão de preço</h1><div style={{ width: 28 }} /></div>

      <div className="card">
        {produtos.length > 0 && (
          <React.Fragment>
            <label className="field-label">Puxar custo de um insumo já comprado (opcional)</label>
            <select value={produtoSelecionado} onChange={(e) => selecionarProduto(e.target.value)}>
              <option value="">Digitar manualmente</option>
              {produtos.map((p) => <option key={p.produto} value={p.produto}>{p.produto} — {formatBRL(p.ultimoValor)}</option>)}
            </select>
          </React.Fragment>
        )}
        <label className="field-label">Custo do produto/insumo (R$)</label>
        <input type="number" step="0.01" value={custo} onChange={(e) => setCusto(e.target.value)} placeholder="Quanto custou pra você" />
        <label className="field-label">Margem desejada (%)</label>
        <input type="number" step="1" value={margemPct} onChange={(e) => setMargemPct(e.target.value)} />
        <label className="field-label">Como calcular</label>
        <div className="chip-row">
          <button className={`pill ${modo === 'margem' ? 'selected' : ''}`} onClick={() => setModo('margem')}>Margem sobre o preço de venda</button>
          <button className={`pill ${modo === 'markup' ? 'selected' : ''}`} onClick={() => setModo('markup')}>Markup sobre o custo</button>
        </div>
      </div>

      {preco != null && (
        <div className="card">
          <div className="row"><span>Preço de venda sugerido</span><strong style={{ fontSize: 20 }}>{formatBRL(preco)}</strong></div>
          <div className="row" style={{ marginTop: 8 }}><span>Lucro por unidade</span><strong className="value positive">{formatBRL(lucroUnitario)}</strong></div>
        </div>
      )}

      <div className="card" style={{ background: 'var(--surface-2)' }}>
        <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
          <strong>Margem sobre o preço de venda</strong>: se você quer que 30% do preço final seja lucro, o preço fica maior — usa a fórmula preço = custo ÷ (1 − margem).<br /><br />
          <strong>Markup sobre o custo</strong>: adiciona a margem em cima do custo — preço = custo × (1 + margem). Mais simples, mas o % de lucro real sobre a venda acaba sendo menor que o markup usado.
        </div>
      </div>
    </div>
  );
}

function Metas({ voltar }) {
  const state = useStore();
  const [faturamento, setFaturamento] = useState(state.metas.faturamento || '');
  const [lucro, setLucro] = useState(state.metas.lucro || '');
  const resumoMes = resumoPeriodo(state.lancamentos, 30);
  const pctFaturamento = state.metas.faturamento ? Math.min(100, (resumoMes.faturamento / state.metas.faturamento) * 100) : 0;
  const pctLucro = state.metas.lucro ? Math.min(100, (resumoMes.lucro / state.metas.lucro) * 100) : 0;
  function salvar() { actions.setMetas({ faturamento: Number(faturamento) || 0, lucro: Number(lucro) || 0 }); }
  return (
    <div>
      <div className="row" style={{ marginBottom: 10 }}><button className="close-x" onClick={voltar}>←</button><h1 style={{ fontSize: 17, margin: 0 }}>Metas do mês</h1><div style={{ width: 28 }} /></div>
      {(state.metas.faturamento > 0 || state.metas.lucro > 0) && (
        <div className="card">
          <h3>Progresso (últimos 30 dias)</h3>
          {state.metas.faturamento > 0 && <div style={{ marginBottom: 14 }}><div className="row"><span>Faturamento</span><span>{formatBRL(resumoMes.faturamento)} / {formatBRL(state.metas.faturamento)}</span></div><div className="progress-track"><div className="progress-fill" style={{ width: `${pctFaturamento}%` }} /></div></div>}
          {state.metas.lucro > 0 && <div><div className="row"><span>Lucro</span><span>{formatBRL(resumoMes.lucro)} / {formatBRL(state.metas.lucro)}</span></div><div className="progress-track"><div className="progress-fill" style={{ width: `${pctLucro}%` }} /></div></div>}
        </div>
      )}
      <div className="card">
        <h3>Definir metas</h3>
        <label className="field-label">Meta de faturamento mensal (R$)</label>
        <input type="number" value={faturamento} onChange={(e) => setFaturamento(e.target.value)} />
        <label className="field-label">Meta de lucro mensal (R$)</label>
        <input type="number" value={lucro} onChange={(e) => setLucro(e.target.value)} />
        <button className="btn-primary" style={{ marginTop: 14 }} onClick={salvar}>Salvar metas</button>
      </div>
    </div>
  );
}

function Configuracoes({ voltar }) {
  const state = useStore();
  const [nome, setNome] = useState(state.perfil.nomeNegocio);
  const [ramo, setRamo] = useState(state.perfil.ramo);
  const [limite, setLimite] = useState(state.perfil.limiteAlertaPreco ?? 5);
  const [chavePixRecebimento, setChavePixRecebimento] = useState(state.perfil.chavePixRecebimento || '');
  const [cidade, setCidade] = useState(state.perfil.cidade || '');
  const [importando, setImportando] = useState(false);
  const fileRef = useRef(null);
  const fixasVsVariaveis = despesasFixasVsVariaveis(state.lancamentos);
  function salvar() { actions.salvarPerfil({ nomeNegocio: nome.trim(), ramo, limiteAlertaPreco: Number(limite) || 5, chavePixRecebimento: chavePixRecebimento.trim(), cidade: cidade.trim() }); }

  async function exportarBackup() {
    const json = JSON.stringify(state, null, 2);
    const nomeArquivo = `caixa-facil-backup-${hojeISO()}.json`;
    try {
      const downloads = window.claude ? await window.claude.use('downloads') : null;
      if (downloads) {
        await downloads.save({ filename: nomeArquivo, data: new Blob([json], { type: 'application/json' }) });
      } else {
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = nomeArquivo;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      }
    } catch (e) {
      if (e && e.code !== 'declined') alert('Não foi possível exportar o backup agora.');
    }
  }

  function importarBackup(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportando(true);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const dados = JSON.parse(reader.result);
        if (!Array.isArray(dados.lancamentos)) throw new Error('formato inválido');
        if (confirm('Isso vai substituir todos os dados atuais deste aparelho pelos dados do arquivo de backup. Continuar?')) {
          actions.restaurarBackup(dados);
        }
      } catch {
        alert('Este arquivo não parece ser um backup válido do Caixa Fácil.');
      } finally {
        setImportando(false);
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  }

  return (
    <div>
      <div className="row" style={{ marginBottom: 10 }}><button className="close-x" onClick={voltar}>←</button><h1 style={{ fontSize: 17, margin: 0 }}>Configurações</h1><div style={{ width: 28 }} /></div>
      <div className="card">
        <h3>Seu negócio</h3>
        <label className="field-label">Nome do negócio</label>
        <input type="text" value={nome} onChange={(e) => setNome(e.target.value)} />
        <label className="field-label">Ramo de atividade</label>
        <div className="chip-row">{RAMOS.map((r) => <button key={r.id} className={`pill ${ramo === r.id ? 'selected' : ''}`} onClick={() => setRamo(r.id)}>{r.label}</button>)}</div>
        <label className="field-label">Alertar quando um insumo subir mais de (%)</label>
        <input type="number" value={limite} onChange={(e) => setLimite(e.target.value)} />
        <label className="field-label">Sua chave Pix (para receber cobranças)</label>
        <input type="text" value={chavePixRecebimento} onChange={(e) => setChavePixRecebimento(e.target.value)} placeholder="CPF, CNPJ, e-mail, celular ou chave aleatória" />
        <label className="field-label">Cidade do negócio</label>
        <input type="text" value={cidade} onChange={(e) => setCidade(e.target.value)} placeholder="Ex.: São Paulo" />
        <button className="btn-primary" style={{ marginTop: 14 }} onClick={salvar}>Salvar</button>
      </div>
      <div className="card">
        <h3>Backup dos dados</h3>
        <div className="alert-box" style={{ background: 'var(--surface-2)', color: 'var(--text-muted)', border: '1px solid var(--border)' }}>
          Seus dados ficam salvos só neste aparelho e neste navegador. Se limpar os dados do navegador ou trocar de aparelho, você perde tudo — a menos que tenha um backup. Uma conta na nuvem com sincronização automática ainda não existe (depende de escolher e configurar um provedor de banco de dados).
        </div>
        <button className="btn-secondary" onClick={exportarBackup}>⬇️ Exportar backup completo (JSON)</button>
        <input ref={fileRef} type="file" accept="application/json" style={{ display: 'none' }} onChange={importarBackup} />
        <button className="btn-ghost" style={{ width: '100%', marginTop: 10 }} onClick={() => fileRef.current && fileRef.current.click()} disabled={importando}>{importando ? 'Importando...' : '⬆️ Importar backup'}</button>
      </div>
      <div className="card">
        <h3>Despesas fixas x variáveis (todo o período)</h3>
        <div className="row"><span>Fixas (aluguel, salário)</span><strong>{formatBRL(fixasVsVariaveis.fixas)} ({fixasVsVariaveis.pctFixas.toFixed(0)}%)</strong></div>
        <div className="row" style={{ marginTop: 6 }}><span>Variáveis</span><strong>{formatBRL(fixasVsVariaveis.variaveis)} ({fixasVsVariaveis.pctVariaveis.toFixed(0)}%)</strong></div>
      </div>
    </div>
  );
}

function App() {
  const state = useStore();
  const [tela, setTela] = useState('inicio');
  const [toast, setToast] = useState(null);
  const [editandoId, setEditandoId] = useState(null);
  function mostrarToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2200); }

  if (!state.perfil) return <div className="phone"><StatusBar /><Onboarding /></div>;

  let conteudo;
  switch (tela) {
    case 'inicio': conteudo = <Dashboard irPara={setTela} />; break;
    case 'lancamentos': conteudo = <Lancamentos onEditar={(id) => { setEditandoId(id); setTela('editar'); }} />; break;
    case 'editar': conteudo = <EditarLancamento lancamento={state.lancamentos.find((l) => l.id === editandoId)} voltar={() => setTela('lancamentos')} onSalvo={() => { setTela('lancamentos'); mostrarToast('Lançamento atualizado!'); }} />; break;
    case 'audio': conteudo = <RecordFlow onSalvo={() => { setTela('inicio'); mostrarToast('Lançamento salvo!'); }} onCancelar={() => setTela('inicio')} />; break;
    case 'contas': conteudo = <Contas />; break;
    case 'mais': conteudo = <Mais irPara={setTela} />; break;
    case 'compras': conteudo = <Compras voltar={() => setTela('mais')} onSalvo={() => { setTela('mais'); mostrarToast('Compra registrada!'); }} />; break;
    case 'precos': conteudo = <Precos voltar={() => setTela('mais')} />; break;
    case 'fluxocaixa': conteudo = <FluxoCaixa voltar={() => setTela('mais')} />; break;
    case 'meuscaixas': conteudo = <MeusCaixas voltar={() => setTela('mais')} />; break;
    case 'conciliacao': conteudo = <Conciliacao voltar={() => setTela('mais')} onToast={mostrarToast} />; break;
    case 'custosfixos': conteudo = <CustosFixos voltar={() => setTela('mais')} onToast={mostrarToast} />; break;
    case 'metas': conteudo = <Metas voltar={() => setTela('mais')} />; break;
    case 'auditoria': conteudo = <Auditoria voltar={() => setTela('mais')} />; break;
    case 'impostos': conteudo = <Impostos voltar={() => setTela('mais')} />; break;
    case 'folha': conteudo = <FolhaPagamento voltar={() => setTela('mais')} />; break;
    case 'relatorios': conteudo = <Relatorios voltar={() => setTela('mais')} />; break;
    case 'precificacao': conteudo = <Precificacao voltar={() => setTela('mais')} />; break;
    case 'config': conteudo = <Configuracoes voltar={() => setTela('mais')} />; break;
    default: conteudo = <Dashboard irPara={setTela} />;
  }

  return (
    <div className="phone">
      <StatusBar />
      <div className="screen" key={tela} style={{ paddingTop: tela === 'audio' ? 16 : undefined }}>
        <div className="screen-fade">{conteudo}</div>
      </div>
      {tela !== 'audio' && <BottomNav tela={tela} irPara={setTela} />}
      {toast && <div className="toast"><span className="toast-check">✓</span>{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
